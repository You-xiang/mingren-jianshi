<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif SC","Source Han Serif SC","宋体",SimSun,Georgia,serif;
  background:#f5f0e8;color:#2c1810;line-height:1.7
}
/* 顶部 */
.hero{
  background:linear-gradient(135deg,#2c1810 0%,#4a2c1a 50%,#2c1810 100%);

}

.hero h1{font-size:3rem;font-weight:700;letter-spacing:8px;position:relative;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
.hero .subtitle{margin-top:10px;font-size:1.05rem;letter-spacing:4px;opacity:.8;position:relative}
.hero .nav-links{margin-top:28px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative}
.hero .nav-links a{
  color:#d4a76a;text-decoration:none;padding:5px 12px;border:1px solid rgba(212,167,106,.3);
  border-radius:20px;font-size:.82rem;transition:all .3s;font-family:"Microsoft YaHei","PingFang SC",sans-serif
}
.hero .nav-links a:hover{background:rgba(212,167,106,.15);border-color:#d4a76a}
/* 导航栏 */
.sticky-nav{
  position:sticky;top:0;z-index:100;
  background:rgba(245,240,232,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid #d4c5a9;padding:8px 16px;display:flex;flex-wrap:wrap;
  justify-content:center;gap:3px 6px;font-family:"Microsoft YaHei","PingFang SC",sans-serif
}
.sticky-nav a{color:#5a3e2b;text-decoration:none;font-size:.78rem;padding:3px 8px;border-radius:4px;transition:background .2s}
.sticky-nav a:hover{background:#d4c5a9}
/* 主容器 */
.container{max-width:1140px;margin:0 auto;padding:36px 20px 60px}
/* 朝代区块 */
.section{scroll-margin-top:56px;margin-bottom:50px}
.section-title{
  display:flex;align-items:baseline;gap:14px;margin-bottom:24px;
  padding-bottom:10px;border-bottom:2px solid #c4a97a
}
.section-title h2{font-size:1.7rem;font-weight:700;color:#3a2418}
.section-title .era{font-size:.88rem;color:#8a7a6a}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
/* 卡片 */
.card{
  background:#fffcf7;border-radius:12px;box-shadow:0 2px 12px rgba(44,24,16,.08);
  overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;border:1px solid #e8dccb
}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(44,24,16,.14)}
.card-hd{
  background:linear-gradient(135deg,#3a2418,#5a3e2b);color:#f0e3d0;
  padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:baseline
}
.card-hd .name{font-size:1.25rem;font-weight:700;letter-spacing:2px}
.card-hd .tag{font-size:.75rem;background:rgba(240,227,208,.15);padding:2px 10px;border-radius:12px;font-family:"Microsoft YaHei",sans-serif}
.card-bd{padding:14px 18px 18px}
.card-bd .bio{font-size:.9rem;line-height:1.7;color:#3a2a1e;margin-bottom:10px}
.card-bd .ft{font-size:.78rem;color:#8a7a6a;text-align:right;font-family:"Microsoft YaHei",sans-serif}
.card-bd .ft::before{content:"点击查看详细生平 →";font-size:.78rem;color:#8a7a6a}
/* 弹窗遮罩 */
.modal-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(44,24,16,.6);z-index:1000;justify-content:center;
  align-items:flex-start;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(4px)
}
.modal-overlay.open{display:flex}
.modal{
  background:#fffcf7;border-radius:16px;max-width:780px;width:100%;
  margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;
  animation:modalIn .35s ease
}
@keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-hd{
  background:linear-gradient(135deg,#3a2418,#5a3e2b);color:#f0e3d0;
  padding:22px 28px 16px;display:flex;justify-content:space-between;align-items:center
}
.modal-hd .mname{font-size:1.7rem;font-weight:700;letter-spacing:3px}
.modal-hd .mdyn{font-size:.85rem;background:rgba(240,227,208,.15);padding:3px 14px;border-radius:14px;font-family:"Microsoft YaHei",sans-serif}
.modal-close{
  width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.12);
  color:#f0e3d0;font-size:1.3rem;cursor:pointer;transition:background .2s;line-height:36px;text-align:center
}
.modal-close:hover{background:rgba(255,255,255,.25)}
.modal-body{padding:24px 28px 28px}
.modal-body .intro{font-size:.95rem;line-height:1.8;color:#3a2a1e;margin-bottom:18px}

.timeline{position:relative;padding-left:28px;margin-bottom:20px}
.timeline::before{
  content:"";position:absolute;left:8px;top:4px;bottom:4px;
  width:2px;background:linear-gradient(to bottom,#c4a97a,#d4a76a,#c4a97a);border-radius:2px
}
.tl-item{position:relative;margin-bottom:18px;padding-left:4px}
.tl-item::before{
  content:"";position:absolute;left:-24px;top:6px;
  width:12px;height:12px;border-radius:50%;
  background:#d4a76a;border:2px solid #f5f0e8;box-shadow:0 0 0 2px #d4a76a
}
.tl-item .period{
  font-size:.78rem;color:#8a7a6a;font-family:"Microsoft YaHei",sans-serif;
  letter-spacing:1px;margin-bottom:2px
}
.tl-item .title{
  font-size:.95rem;font-weight:600;color:#3a2418;margin-bottom:3px
}
.tl-item .desc{font-size:.88rem;color:#4a3a2a;line-height:1.6}
/* 作品区 */
.works-block h4{
  font-size:.85rem;color:#8a7a6a;font-family:"Microsoft YaHei",sans-serif;
  letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px dashed #e0d4c4
}
.works-block .work-item{
  background:#f8f2e8;border-left:3px solid #c4a97a;padding:12px 16px;margin-bottom:10px;border-radius:0 8px 8px 0
}
.work-item .wname{font-weight:600;color:#3a2418;margin-bottom:2px}
.work-item .wperiod{font-size:.78rem;color:#8a7a6a;font-family:"Microsoft YaHei",sans-serif}
.work-item .wcontext{font-size:.85rem;color:#4a3a2a;margin:4px 0}
.work-item .wquote{
  font-style:italic;color:#5a3e2b;background:rgba(212,167,106,.1);
  padding:6px 12px;border-radius:4px;margin-top:4px;font-size:.88rem
}
/* 时代背景 */
.bg-box{
  background:#ede6db;border-radius:8px;padding:14px 18px;margin-bottom:18px;font-size:.88rem;line-height:1.7;color:#3a2a1e
}
.bg-box strong{color:#3a2418;font-weight:600}
/* 页脚 */
footer{text-align:center;padding:36px 20px;color:#8a7a6a;font-size:.82rem;border-top:1px solid #d4c5a9;font-family:"Microsoft YaHei",sans-serif}
/* 响应式 */
@media(max-width:640px){
  .hero h1{font-size:2rem;letter-spacing:4px}.hero{padding:44px 16px 32px}
  .section-title h2{font-size:1.35rem}.grid{grid-template-columns:1fr}
  .modal-body{padding:16px 18px 20px}.modal-hd{padding:16px 18px 12px;flex-wrap:wrap;gap:6px}
  .modal-hd .mname{font-size:1.3rem}
}
</style>
</head>

  {id:"chunqiu",dynasty:"春秋",name:"孔丘",label:"孔子",
  intro:"儒家学派创始人，伟大的思想家、教育家。少贫贱而好学，中年聚徒讲学，首创私学。曾任鲁国司寇，后周游列国十四年。晚年归鲁，删《诗》《书》、定《礼》《乐》、序《周易》、修《春秋》。被誉为'万世师表'。",
  bg:"春秋晚期，礼崩乐坏，诸侯争霸。旧有的宗法秩序瓦解，'臣弑其君、子弑其父'频发。孔子一生致力于恢复周礼，以'仁'为核心重建社会秩序。",
  timeline:[
    {period:"前551年",title:"诞生",desc:"生于鲁国陬邑（今山东曲阜）。父叔梁纥、母颜徵在。三岁丧父，由母亲抚养长大。"},
    {period:"少年贫贱",title:"'吾少也贱，故多能鄙事'",desc:"家境贫寒，做过管理仓库的'委吏'和管畜牧的'乘田'。但勤学好问，无人不师。"},
    {period:"30岁",title:"开创私学",desc:"首开私人讲学之风，打破'学在官府'的传统，有教无类，弟子三千。这是中国教育史上的革命。"},
    {period:"51-55岁",title:"仕鲁",desc:"任中都宰，一年后升司空、大司寇（司法部长），摄行相事。鲁国大治。邻国齐国恐惧，赠女乐文马离间，孔子失望离鲁。"},
    {period:"55-68岁",title:"周游列国",desc:"率弟子离开鲁国，周游卫、宋、陈、蔡、郑、楚等国，历时十四年。颠沛流离，'累累若丧家之犬'，但始终不渝。"},
    {period:"68-73岁",title:"归鲁著述",desc:"被迎回鲁国。晚年致力于整理六经：《诗》《书》《礼》《乐》《易》《春秋》。七十三岁而卒。"}
  ],
  works:[
    {name:"《论语》",period:"晚年及其后",context:"孔子去世后，由弟子及再传弟子辑录而成。记录孔子与其弟子的言行，是儒家最重要的经典。'半部论语治天下'。",quote:"学而不思则罔，思而不学则殆。"},
    {name:"编修《春秋》",period:"归鲁后（前481年）",context:"以鲁国史为基础，笔削春秋，'一字褒贬'。孟子说：'孔子成《春秋》而乱臣贼子惧。'",quote:"知我者其惟《春秋》乎！罪我者其惟《春秋》乎！"}
  ]},

  {id:"chunqiu",dynasty:"战国·楚",name:"屈原",label:"屈原",
  intro:"中国第一位伟大诗人，楚辞体开创者。楚国贵族，曾任左徒、三闾大夫。主张联齐抗秦，遭谗言被放逐。秦将白起攻破郢都后，自沉汨罗江殉国。端午节的起源之一。",
  bg:"战国后期，秦国日益强大，楚国内政腐败、外交失策。屈原身处'举世皆浊我独清，众人皆醉我独醒'的困境——忠诚报国却被诋毁放逐。",
  timeline:[
    {period:"约前340年",title:"出生于楚国贵族",desc:"与楚王同姓（芈姓屈氏），出身贵族。自幼博闻强识，明于治乱。"},
    {period:"20多岁",title:"任左徒",desc:"早年受楚怀王信任，任左徒（相当于副宰相），'入则与王图议国事，出则接遇宾客'。"},
    {period:"遭谗被疏",title:"第一次被放逐",desc:"上官大夫靳尚妒其才，进谗言。怀王疏远屈原，将其流放到汉北。"},
    {period:"前299年",title:"怀王客死秦国",desc:"怀王不听屈原劝谏，入武关与秦昭王会盟，被秦扣留，三年后客死秦国。屈原闻讯悲痛欲绝。"},
    {period:"顷襄王时期",title:"第二次被放逐",desc:"顷襄王继位，令尹子兰等继续迫害屈原，将其流放江南（今湖南沅湘一带）。在流放中创作了大量不朽诗篇。"},
    {period:"前278年",title:"投江殉国",desc:"秦将白起攻陷楚国郢都。屈原闻讯，作《怀沙》后，怀抱巨石自沉于汨罗江。时年约62岁。"}
  ],
  works:[
    {name:"《离骚》",period:"第一次被放逐期间",context:"中国最长的抒情诗（373句,2477字）。以香草美人比喻忠贞，以神话传说寄托理想。'离骚'意为'遭遇忧患'。全诗展现诗人崇高人格与悲剧命运。",quote:"路漫漫其修远兮，吾将上下而求索。"},
    {name:"《九歌》",period:"早年创作",context:"根据民间祭祀乐歌改编的组诗（11篇），包括《东皇太一》《云中君》《湘君》《湘夫人》《山鬼》《国殇》等。瑰丽奇幻，情感奔放。",quote:"沅有芷兮澧有兰，思公子兮未敢言。"},
    {name:"《天问》",period:"流放时期",context:"全篇以172个问题组成，从宇宙起源到神话传说、历史兴衰，展现诗人对自然与社会的深刻怀疑与思考。",quote:"遂古之初，谁传道之？上下未形，何由考之？"}
  ]},

  {id:"chunqiu",dynasty:"春秋",name:"孙武",label:"孙子",
  intro:"春秋时期军事家，被尊为'兵圣'。齐国人，后入吴国，以《孙子兵法》十三篇见吴王阖闾。助吴国西破强楚、北威齐晋。其兵法为世界最早、影响最大的军事理论著作。",
  bg:"春秋末期，诸侯争霸战争频繁。早期的'仁义之师'观念逐渐被务实的军事谋略取代。孙武的兵法则是对这一时代战争经验的理论升华。",
  timeline:[
    {period:"约前545年",title:"出生",desc:"齐国乐安（今山东惠民）人，田氏后裔。家族为军事世家。"},
    {period:"避乱入吴",title:"投奔吴国",desc:"齐国田氏内乱，孙武避乱南下投奔吴国，隐居著书。"},
    {period:"前512年",title:"吴宫教战",desc:"吴王阖闾读其兵法后召见。为测试其能力，令孙武操练宫女。孙武斩杀违令的吴王宠姬二人，令行禁止。"},
    {period:"伐楚",title:"率军攻楚",desc:"与伍子胥共同辅佐吴王，屡次伐楚。前506年以3万吴军大破20万楚军，攻入楚都郢都。"},
    {period:"晚年",title:"功成身退",desc:"目睹伍子胥被吴王夫差赐死的悲剧后，孙武急流勇退，隐退著书。其后世孙孙膑亦为著名军事家。"}
  ],
  works:[
    {name:"《孙子兵法》",period:"隐居吴国时期（约前512年）",context:"十三篇约6000字，分别为始计、作战、谋攻、军形、兵势、虚实、军争、九变、行军、地形、九地、火攻、用间。不仅是兵书，更是哲学著作。",quote:"知己知彼，百战不殆。"}
  ]},

  // ===== 秦汉 =====
  {id:"chunqiu",dynasty:"春秋",name:"管子",label:"管仲（管敬仲）",
  intro:"春秋时期齐国名相，后来的法家先驱。本为囚徒，经好友鲍叔牙举荐辅佐齐桓公，'尊王攘夷'，九合诸侯，一匡天下，助齐桓公成为春秋首霸。被后人誉为'华夏第一相'。",
  bg:"春秋初期，周室衰微，戎狄交侵，诸侯争霸。齐国内乱，公子纠与公子小白争夺君位。管仲辅佐纠，鲍叔牙辅佐小白。小白即位为桓公后，管仲受荐为相，开启了尊王攘夷的霸业。",
  timeline:[
    {period:"约前723年",title:"出身贫寒",desc:"颍上（今安徽颍上）人。早年家贫，曾与鲍叔牙合伙经商，分财时多取，鲍叔牙知其贫而不以为贪。'管鲍之交'成为知遇的典范。"},
    {period:"内乱",title:"辅公子纠",desc:"齐国内乱，管仲辅佐公子纠，曾用箭射中公子小白带钩。小白佯死逃过一劫。后公子小白即位为齐桓公。"},
    {period:"桓公不记仇",title:"任为相国",desc:"鲍叔牙知其才，力劝桓公释前嫌。桓公竟不计一箭之仇，拜管仲为相，尊称'仲父'。'管仲射钩'与'桓公弃恨'传为美谈。"},
    {period:"改革图强",title:"治国之策",desc:"在齐推行改革：'叁其国而伍其鄙'，整顿赋税，发展农工商，'通货积财，富国强兵'，是古代最早的改革家之一。"},
    {period:"尊王攘夷",title:"九合诸侯",desc:"打出'尊王攘夷'旗号，尊周天子，抵御戎狄南侵。'存邢救卫''召陵之盟'，齐桓公成为春秋五霸之首。"},
    {period:"约前645年",title:"病逝",desc:"辅佐齐桓公四十年，使齐国成为霸主之国。临终推荐隰朋等贤才继任，'老马识途'等典皆出其麾下。"}
  ],
  works:[
    {name:"《管子》",period:"后世整理",context:"托名管仲的著作集，实为战国时齐稷下学者编纂。涵盖经济、政治、军事、哲学，是先秦重要典籍。",quote:"仓廪实而知礼节，衣食足而知荣辱。"},
    {name:"治世名言",period:"辅政时期",context:"管仲辅齐桓公成就霸业，其经世致用、富国利民的思想影响深远。",quote:"政之所兴，在顺民心；政之所废，在逆民心。"}
  ]},

  {id:"chunqiu",dynasty:"春秋",name:"范蠡",label:"范蠡（陶朱公）",
  intro:"春秋末期政治家、军事家、商圣。辅佐越王勾践'卧薪尝胆'，灭吴复国。功成之后急流勇退，泛舟五湖，三聚三散获巨富，为后世'商人鼻祖'陶朱公。",
  bg:"吴越争霸之际，越王勾践战败为奴。范蠡与文种辅佐勾践，忍辱负重十年生聚。越国复起灭吴后，他洞察'飞鸟尽，良弓藏'，选择功成身退，成为中国文化中善于进退的典范。",
  timeline:[
    {period:"约前536年",title:"出身",desc:"楚国宛（今河南南阳）人。出身贫寒，心怀济世之志。好友文种赏识其才。"},
    {period:"入越辅佐",title:"事越王勾践",desc:"吴越夫椒之战，越军惨败，越王勾践仅存五千人退守会稽。范蠡劝勾践卑身事吴以求存，随勾践入吴为质。"},
    {period:"卧薪尝胆",title:"忍辱负重",desc:"勾践入吴为奴三年，范蠡伴其左右。归国后献计，越王'卧薪尝胆'，励精图治，'十年生聚，十年教训'。"},
    {period:"灭吴雪耻",title:"佐勾践复国",desc:"趁吴王夫差北上争霸、后方空虚，越军出击。前473年一举灭吴，夫差自刎。范蠡居功至伟。"},
    {period:"功成身退",title:"泛舟五湖",desc:"他深知勾践'可与共患难，不可与共乐'。劝文种同退，'飞鸟尽，良弓藏；狡兔死，走狗烹。'文种不听，终被赐死。范蠡独驾扁舟远去隐居。"},
    {period:"三聚三散",title:"陶朱公经商",desc:"隐居后改名经商，三致千金，又三散家财于乡邻。定居定陶，号'陶朱公'，被奉为'财神''商圣'。约前448年卒。"}
  ],
  works:[
    {name:"《陶朱公经商十八则》",period:"经商时期",context:"相传为范蠡经商经验的总结，被后世商人奉为圭臬。体现其洞察时机、审时度势的商业智慧。",quote:"飞鸟尽，良弓藏；狡兔死，走狗烹。越王为人可与共患难，不可与共乐。"},
    {name:"经商智慧",period:"晚年",context:"范蠡'旱则资舟，水则资车'的贵出贱取之术，是古代朴素的市场规律观。今之'陶朱公'已成富商代名词。",quote:"旱则资舟，水则资车，以待乏也。"}
  ]},

  {id:"chunqiu",dynasty:"战国·秦",name:"商鞅",label:"商鞅",
  intro:"战国时期政治家、改革家，法家代表人物。在秦国主持变法，使秦国由弱变强，为后来统一六国奠定基础。'徙木立信''商鞅变法'为其最大历史功绩与典故。",
  bg:"战国初期，秦国地处西陲，中原诸侯视其为'夷狄'，常会盟不带秦。秦孝公发愤图强，下令求贤。商鞅以'霸道'之术打动孝公，开启了一场深刻改变中国历史的变法。",
  timeline:[
    {period:"约前390年",title:"出身卫国",desc:"卫国（今河南安阳一带）人，本名公孙鞅，或卫鞅。早年习刑名之术，为魏国相公孙痤家臣。"},
    {period:"入秦献策",title:"三见孝公",desc:"闻秦孝公求贤，西入秦，以帝道、王道、霸道三试孝公。终以'强国之术'打动孝公，主张变法。"},
    {period:"徙木立信",title:"立木取信",desc:"为取信于民，在都城南门立三丈之木，悬赏移木者五十金。有人移之，果然赏金。百姓见此确信朝廷令出必行，'徙木立信'由此而来。"},
    {period:"商鞅变法",title:"两次变法",desc:"前356年、前350年两次变法：废井田、开阡陌，奖励耕战，推行县制，连坐告奸，统一度量衡。秦国'道不拾遗，山无盗贼'。"},
    {period:"西入强秦",title:"伐魏取地",desc:"率军伐魏，夺回河西之地。因功封于商（今陕西商洛），号'商君'，故称商鞅。秦国自此大治，雄视诸侯。"},
    {period:"约前338年",title:"被害",desc:"孝公去世，太子即位为惠文王。守旧势力报复，商鞅被诬谋反，车裂于市。然新法不废，秦国继续强盛，为其后统一中国奠基。"}
  ],
  works:[
    {name:"《商君书》",period:"战国",context:"法家重要著作，记述商鞅变法的指导思想与政策主张。论'治世不一道，便国不法古'。",quote:"治世不一道，便国不法古。故汤武不循古而王，夏殷不易礼而亡。"},
    {name:"变法名言",period:"强国之术",context:"商鞅力主以法治国、奖励耕战，其理论是秦灭六国的制度基础。",quote:"苟可以强国，不法其故；苟可以利民，不循其礼。"}
  ]},

  {id:"chunqiu",dynasty:"战国·赵",name:"廉颇",label:"廉颇",
  intro:"战国时期赵国名将，'战国四大名将'之一。以勇猛善战闻名，与白起、王翦、李牧并列。因功封上卿，'负荆请罪''一饭三遗矢'等典故流传千古。",
  bg:"战国后期，秦强赵弱，赵有廉颇、李牧等名将与强秦抗衡。廉颇以军事才能备受敬重，但因赵王猜忌与权臣谗害，晚年颠沛流离，客死楚国。",
  timeline:[
    {period:"约前327年",title:"出身",desc:"赵国名将，生卒年不详，活跃于赵惠文王时期。以勇力闻于赵。"},
    {period:"伐齐越",title:"显赫军功",desc:"伐齐大胜，取阳晋；又将兵伐魏。赵惠文王十五年，拜为上卿，以勇气闻于诸侯，贵重一时。"},
    {period:"渑池之会",title:"蔺廉和好",desc:"蔺相如完璧归赵、渑池会后又立功，位在廉颇之上。廉颇不服，欲羞辱之。相如顾全大局，处处避让。廉颇感悟，'负荆请罪'，两人结为刎颈之交。将相和传为千古美谈。"},
    {period:"抗秦守赵",title:"长平拒秦",desc:"长平之战前，廉颇坚壁固守、持久疲敌，秦军无计可施。后赵王中反间计，以赵括代之，酿成长平惨败。"},
    {period:"晚景凄凉",title:"受谗客死",desc:"晚年因赵悼襄王即位后夺其兵权，愤而奔魏、楚。在楚虽衣食无忧，却时时思归赵国，'一饭三遗矢'（人称其年老不堪），终客死楚地，未能复为赵将。"}
  ],
  works:[
    {name:"《史记·廉颇蔺相如列传》",period:"后世",context:"司马迁所作名篇，完整记录廉颇与蔺相如'将相和'的感人故事，是《史记》中最精彩的列传之一。",quote:"廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪。曰：'鄙贱之人，不知将军宽之至此也。'"}
  ]},

  {id:"chunqiu",dynasty:"战国·赵",name:"蔺相如",label:"蔺相如",
  intro:"战国时期赵国上卿，智勇双全的政治家。'完璧归赵''渑池之会''负荆请罪'三大典故的主角，为赵国立下不世之功。官拜相国，位居廉颇之上。",
  bg:"赵国与强秦相邻，屡受欺凌。秦昭王以强凌弱，索璧、赴会，皆欲辱赵。蔺相如身为舍人，以过人胆识与智慧，维护了赵国的尊严。",
  timeline:[
    {period:"约前329年",title:"出身",desc:"时为赵宦者令缪贤舍人。虽有才，然为人所知于缪贤府中。"},
    {period:"完璧归赵",title:"持璧入秦",desc:"秦昭王以十五城易赵国和氏璧。相如奉璧入秦，见秦王无意割城，'怒发冲冠'，持璧倚柱，宁碎己头，终使亲王罢手。相如完璧归赵，升为上大夫。"},
    {period:"渑池之会",title:"折服秦王",desc:"秦王邀赵王相会渑池。席间秦王强赵王鼓瑟以辱赵。相如针锋相对，请秦王击缶，秦终不能占上风。会后以其功拜为上卿。"},
    {period:"将相和",title:"负荆请罪",desc:"廉颇不服位次，欲辱相如。相如以国家为重，引车避匿，'先国家之急而后私仇'。廉颇终被感化，负荆请罪。二人将相交欢，赵国固若金汤。"}
  ],
  works:[
    {name:"完璧归赵",period:"其功业",context:"司马迁《史记》详记其事。蔺相如由一介舍人而官拜上卿，其智勇双全、顾全大局的品格为后世称道。",quote:"夫以秦王之威，而相如廷叱之，辱其群臣。相如虽驽，独畏廉将军哉？顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。"}
  ]},

  {id:"chunqiu",dynasty:"战国·齐",name:"孙膑",label:"孙膑",
  intro:"战国时期齐国军事家，孙武后裔。遭庞涓陷害被剔去膝盖骨，装疯得活。后任齐国军师，'围魏救赵''减灶诱敌'两计败庞涓，终在桂陵、马陵大破魏军。著有《孙膑兵法》。",
  bg:"战国中期，魏国魏惠王称霸，任用庞涓为大将。孙、庞同出鬼谷子门下，庞涓忌孙膑之才而陷害之。孙膑逃入齐国，以绝世军事才华辅佐齐威王，报知遇之恩与旧仇。",
  timeline:[
    {period:"约前380年",title:"师从鬼谷",desc:"齐国人，孙武后裔。少时与庞涓同师鬼谷子，学兵法于山中。"},
    {period:"剔骨之祸",title:"膑脚遭祸",desc:"庞涓下魏为将，忌孙膑贤能，诱其入魏，以'通敌'之罪判刑，剔去膝盖骨，'孙膑'之名由此而来。孙膑装疯卖傻，才免一死。"},
    {period:"逃入齐国",title:"任齐国军师",desc:"齐使淳于髡知其贤，秘密载其归齐。齐将田忌识其才，孙膑以'田忌赛马'之策使田忌胜威王马赛。田忌荐孙膑为军师。"},
    {period:"围魏救赵",title:"桂陵之战",desc:"魏攻赵，赵求救于齐。孙膑献'围魏救赵'之策，直捣魏国大梁。魏回救，齐于桂陵设伏大破魏军，生擒庞涓。"},
    {period:"减灶诱敌",title:"马陵之战",desc:"前341年，魏伐韩，齐救韩。孙膑用'减灶'之计诱庞涓轻进，在马陵道择地设伏。庞涓中计自刎而死。孙膑自此名显天下，报仇雪恨。"},
    {period:"著书",title:"《孙膑兵法》",desc:"晚年著《孙膑兵法》，惜于汉代失传，1972年银雀山汉墓出土竹简数百枚，重现于世。"}
  ],
  works:[
    {name:"《孙膑兵法》",period:"晚年",context:"88篇约6000字，1972年银雀山汉墓出土。继承发展孙武思想，提出'贵势''出奇'等战术要义。",quote:"天地之间，莫贵于人。"},
    {name:"田忌赛马",period:"仕齐初期",context:"以'以己之长，击彼之短'的智慧帮田忌赢得赛马，是'扬长避短、整体取胜'的经典战术启蒙。",quote:"今以君之下驷与彼上驷，取君上驷与彼中驷，取君中驷与彼下驷。"}
  ]},

  {id:"chunqiu",dynasty:"春秋·吴",name:"伍子胥",label:"伍子胥",
  intro:"春秋末期吴国大夫、军事家。父兄被楚平王冤杀，他逃奔吴国，率吴军破楚，'鞭尸三百'雪恨。助吴称霸，后因劝谏吴王夫差灭越，被赐剑自尽，'伍子胥过昭关，一夜白头'之典即出其逃吴路上。",
  bg:"楚平王听信谗言杀害伍奢及长子伍尚。伍子胥立志复仇，投奔吴国。吴王阖闾用其谋，楚弱吴强，郢都终被攻破。其复仇与忠烈，成就了流传数千年的悲壮传奇。",
  timeline:[
    {period:"约前559年",title:"出身楚国",desc:"楚国椒邑（今湖北监利）人，楚大夫伍奢次子。有谋略，通兵法。"},
    {period:"父兄遇害",title:"一夜白头",desc:"楚平王杀伍奢、伍尚。伍子胥逃往吴国，途中过昭关，楚兵严查。因愁苦一夜之间白发尽染，'一夜白头'之典由此而来。改服遮面，混过关去。"},
    {period:"吹箫吴市",title:"进身吴庭",desc:"入吴后吹箫行乞于市，被吴公子光所赏识，参与策划刺杀吴王僚、助光即位为阖闾。"},
    {period:"伐楚报怨",title:"破楚鞭尸",desc:"与孙武等佐阖闾，前506年破楚都郢。楚平王已死，伍子胥掘其墓，'鞭尸三百'以泄父兄之恨。"},
    {period:"力谏灭越",title:"忠言逆耳",desc:"越王勾践战败请降，伍子胥力主灭越，'勾践为人能辛苦，今不灭，后将悔之。'吴王夫差不听，反信谗言。"},
    {period:"约前484年",title:"赐剑自尽",desc:"夫差赐属镂剑令其自尽。伍子胥遗言：'抉吾眼悬吴东门之上，以观越寇之入灭吴也。'九年后果如所言，越灭吴。"}
  ],
  works:[
    {name:"《伍子胥列传》所记",period:"忠烈典训",context:"伍子胥忍辱复仇、忠谏死国的悲壮事迹，为《史记》所载，是'春秋复仇'主题的母题。",quote:"飞鸟尽、良弓藏；奸臣犹在，不遽诛，将遗患于无穷。"},
    {name:"谏言",period:"力谏夫差",context:"当年卧薪尝胆、谦卑事吴的勾践终成灭吴之人，验证了伍子胥洞察之明。",quote:"越在腹心，不急灭之，反养虎以贻患。"}
  ]},

  {id:"chunqiu",dynasty:"战国·秦",name:"白起",label:"白起",
  intro:"战国时期秦国名将，'战国四大名将'之首，被封'武安君'。一生攻无不克战无不胜，伊阙、鄢郢、长平三大战役奠定了秦统一基础。坑杀赵卒的争议使其成为军事史上一大悲剧人物。",
  bg:"秦昭王时期，秦国已呈席卷天下之势。白起以'料敌合变，出奇无穷'的军事天才，统帅秦军横扫六国，是战国尾声锋芒最盛的名将。",
  timeline:[
    {period:"约前315年",title:"崛起",desc:"郿县（今陕西眉县）人。善用兵，事秦昭王，从低级军官逐步崛起。"},
    {period:"伊阙之战",title:"大破韩魏",desc:"前293年，率兵攻韩魏，伊阙之战大破韩魏24万联军，韩魏精锐尽丧。升国尉。"},
    {period:"伐楚",title:"攻拔郢都",desc:"前279年，水淹鄢城，前278年克楚都郢。楚被迫迁都，白起受封'武安君'。"},
    {period:"长平之战",title:"坑杀赵卒",desc:"前260年，与赵括决战长平，诱敌深入、分割围歼，斩杀赵卒45万。战后白起坑杀降卒，成为其军事生涯最大的争议点，'杀降不祥'。"},
    {period:"赐死",title:"功高被忌",desc:"昭王与相国范雎猜忌白起，前257年赐剑令其自尽。一代战神以悲剧收场。后人叹：'千载之下，犹有遗憾。'" }
  ],
  works:[
    {name:"战功",period:"武安君时期",context:"白起被后世兵家推崇，'以正合，以奇胜'的用兵之道达到极致。与廉颇、王翦、李牧并称'战国四大名将'。",quote:"兵以诈立，以利动，以分合为变者也。"}
  ]},

  // ===== 秦汉 =====
  {id:"qinhan",dynasty:"秦",name:"嬴政",label:"秦始皇",
  intro:"首位完成中国统一的皇帝。13岁即位，39岁灭六国，建立中国第一个中央集权的多民族帝国。推行郡县制、书同文、车同轨、统一度量衡、修筑长城。也因焚书坑儒、严刑峻法被后世批评。",
  bg:"战国末期，秦国经过商鞅变法后国力最强。六国衰弱腐败，统一已是历史大势。秦始皇以铁腕手段完成了这一历史使命，也开创了延续两千年的帝制时代。",
  timeline:[
    {period:"前259年",title:"生于邯郸",desc:"出生于赵国邯郸，父秦异人（子楚），母赵姬。幼年在赵国为人质。"},
    {period:"前247年",title:"13岁即秦王位",desc:"父庄襄王去世，年幼的嬴政即位。相国吕不韦擅权，太后赵姬与嫪毐私通。"},
    {period:"前238年",title:"22岁亲政",desc:"行冠礼亲政。平定嫪毐叛乱，罢免吕不韦，彻底掌握权力。"},
    {period:"前230-221年",title:"十年灭六国",desc:"先后灭韩、赵、魏、楚、燕、齐六国，完成统一。建立中国历史上第一个大一统王朝。"},
    {period:"前221年",title:"称皇帝",desc:"自称'始皇帝'。推行郡县制，分天下为三十六郡。统一文字、货币、度量衡、车轨。"},
    {period:"前213-212年",title:"焚书坑儒",desc:"采纳李斯建议，焚毁民间诗书百家语。次年坑杀四百六十余名术士儒生。这是中国文化史上最沉重的一页。"},
    {period:"前210年",title:"驾崩",desc:"第五次东巡途中病逝于沙丘平台（今河北广宗），享年50岁。九月葬于骊山始皇陵。"}
  ],
  works:[
    {name:"泰山刻石",period:"前219年",context:"东巡泰山，立石颂德。由李斯以小篆书写，是秦代小篆的标准范本。原石现仅存残片。",quote:"皇帝临位，作制明法，臣下修饬。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"司马迁",label:"司马迁",
  intro:"中国最伟大的史学家。继承父志任太史令，因替李陵辩护受宫刑。忍辱负重发愤著书，历时十四年完成《史记》——中国第一部纪传体通史（130篇，52万字），记载了从黄帝到汉武帝约3000年历史。",
  bg:"汉武帝时期是西汉鼎盛时代，开疆拓土、独尊儒术，但也伴随着严酷的专制统治。司马迁身处的正是这样一个辉煌与残酷并存的年代，他的个人命运与大时代紧密纠缠。",
  timeline:[
    {period:"前145年",title:"出身史官世家",desc:"夏阳（今陕西韩城）人。父司马谈为太史令，学识渊博。司马迁自幼受良好教育。"},
    {period:"20岁",title:"壮游天下",desc:"开始漫游全国，足迹遍及东南、中原、西南，考察历史遗迹、搜集轶事传闻，为《史记》积累素材。"},
    {period:"前108年",title:"继任太史令",desc:"父亲去世三年后，继任太史令。得以遍览皇家藏书石室金匮之书。"},
    {period:"前104年",title:"开始著史",desc:"与唐都、落下闳等共订《太初历》后，正式开始了《史记》的撰著。"},
    {period:"前99年",title:"李陵之祸",desc:"李陵率五千步卒与匈奴八万骑兵血战，兵败投降。满朝皆责李陵，司马迁独为其辩护。武帝大怒，下狱。"},
    {period:"前98年",title:"受宫刑",desc:"按律当斩。但为完成《史记》，司马迁选择以宫刑（腐刑）代死。这是士大夫最大的耻辱。他在《报任安书》中写下了受刑后的刻骨之痛。"},
    {period:"前91年",title:"《史记》成书",desc:"历时十四年，终于完成《史记》这部不朽巨著。共130篇，52万余字。成书后不久即去世。"}
  ],
  works:[
    {name:"《史记》",period:"前104年-前91年",context:"中国第一部纪传体通史，十二本纪、十表、八书、三十世家、七十列传。鲁迅誉其为'史家之绝唱，无韵之离骚'。",quote:"人固有一死，或重于泰山，或轻于鸿毛。"},
    {name:"《报任安书》",period:"受刑后",context:"写给友人任安的复信，剖白自己忍辱著史的心路历程。全文激昂悲壮，是千古至文。",quote:"所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世而文采不表于后世也。"}
  ]},

  {id:"qinhan",dynasty:"东汉",name:"曹操",label:"曹操（魏武帝）",
  intro:"东汉末年政治家、军事家、文学家。挟天子以令诸侯，统一北方。开创建安文学，与其子曹丕、曹植合称'三曹'。诗歌气韵沉雄，慷慨悲凉。历史上评价两极，但毛宗岗等夸大了其负面形象。",
  bg:"东汉末年，黄巾起义后天下大乱，群雄并起。董卓专权、诸侯割据，汉室名存实亡。这是一个'白骨露于野，千里无鸡鸣'的乱世，也是英雄辈出的时代。",
  timeline:[
    {period:"155年",title:"出生于沛国谯县",desc:"今安徽亳州。父曹嵩为宦官曹腾养子。少年任侠放荡，不治行业。"},
    {period:"174年",title:"举孝廉入仕",desc:"20岁举孝廉，任洛阳北部尉。造五色棒悬于城门，违法者不论贵贱皆棒杀，京师敛迹。"},
    {period:"190年",title:"起兵讨董",desc:"董卓乱政，曹操散家财、合义兵，首倡讨伐董卓。后迎汉献帝迁都许昌，'挟天子以令诸侯'。"},
    {period:"200年",title:"官渡之战",desc:"以少胜多，大破袁绍十万大军。此为统一北方的决定性战役。"},
    {period:"208年",title:"赤壁之战",desc:"率20余万大军南下，被孙刘联军以火攻击败。退回北方，天下三分之势自此定型。"},
    {period:"220年",title:"病逝洛阳",desc:"病逝于洛阳，享年66岁。临终遗令：'分香卖履'，琐碎平常，尽显真性情。曹丕称帝后追尊为魏武帝。"}
  ],
  works:[
    {name:"《短歌行》",period:"赤壁之战前后",context:"'对酒当歌，人生几何'——面对天下未定而人生苦短，曹操借酒抒怀，表达求贤若渴的迫切心情。",quote:"对酒当歌，人生几何！譬如朝露，去日苦多。"},
    {name:"《观沧海》",period:"207年北征乌桓",context:"北征乌桓大胜后，登临碣石山观海而作。这是中国第一首完整的写景诗，气象宏大。",quote:"日月之行，若出其中；星汉灿烂，若出其里。"},
    {name:"《龟虽寿》",period:"晚年",context:"虽到晚年，壮心不已。表达老当益壮、积极进取的人生态度。",quote:"老骥伏枥，志在千里；烈士暮年，壮心不已。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"张良",label:"张良（留侯）",
  intro:"西汉开国谋臣，'汉初三杰'之一。刺秦、圯上拾履、辅佐刘邦，运筹帷幄之中，决胜千里之外。封留侯，功成身退，托名辟谷，为智者之典范。'孺子可教'之典源于此。",
  bg:"秦末天下大乱，刘邦起兵，萧何、韩信、张良并称三杰。张良以智谋辅刘邦，屡出奇计，助其灭秦、败项羽、定天下。汉初'鸟尽弓藏'，张良激流勇退，保全自身。",
  timeline:[
    {period:"约前250年",title:"出身韩国",desc:"字子房，韩国贵族之后。韩为秦所灭，张良怀亡国之恨，弟死不葬，散尽家财求刺客刺秦王。"},
    {period:"博浪沙",title:"刺秦不遂",desc:"与力士在博浪沙抛铁椎击秦始皇，不中。秦皇大怒，大索天下，张良改名姓，亡匿下邳。'博浪沙一击'为其少年侠气之证。"},
    {period:"圯上老人",title:"拾履进履",desc:"在下邳桥上遇一老翁，故意将履堕桥下使张良取之。张良恭谨为老翁拾履、跪履之。老人曰'孺子可教矣'，授以《太公兵法》。张良日夜研读，尽得其要。"},
    {period:"辅佐刘邦",title:"谋定天下",desc:"投刘邦后献计：先入关中、还军霸上、约法三章；鸿门宴上斡旋；用韩信、彭越等。'运筹帷幄之中，决胜千里之外，吾不如子房。'刘邦如此评价。"},
    {period:"功成身退",title:"辟谷隐退",desc:"封留侯后，闻'鸟尽弓藏，兔死狗烹'，自请引退，'乃学辟谷，道引轻身'，不问朝政。'留侯'之道保全其身。"},
    {period:"约前186年",title:"去世",desc:"卒谥'文成侯'。张良的智略与进退之道，成为后世士人理想的范本。"}
  ],
  works:[
    {name:"《太公兵法》",period:"圯上所得",context:"相传为圯上老人所授，张良学而助汉。'圯上受书'成为求师问道、虚心好学的典故。",quote:"孺子可教矣。"},
    {name:"谋略",period:"辅汉时期",context:"'运筹帷幄'一词即源于刘邦对张良的评价，后世以此形容足智多谋之士。",quote:"运筹帷幄之中，决胜千里之外。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"韩信",label:"韩信",
  intro:"西汉开国名将，'汉初三杰'之一、'兵仙''战神'。从胯下之辱到登坛拜将，'明修栈道暗度陈仓''背水一战''十面埋伏'皆出其手。功高不赏，终被吕后所诛。'胯下之辱''多多益善'等典流传。",
  bg:"秦末楚汉相争，刘邦以弱胜强灭项羽。韩信以军事天才，定三秦、破魏赵、取齐、围垓下，为汉建立不世之功。然功高震主，在刘邦忌惮与吕后密谋下身死，盛极而衰，发人深省。",
  timeline:[
    {period:"约前231年",title:"贫贱出身",desc:"淮阴（今江苏淮安）人。少时贫困，常寄食于人。曾受市井少年胯下之辱，能忍一时之辱成大事。"},
    {period:"登坛拜将",title:"萧何月下追韩信",desc:"初投项羽、再投刘邦，皆不见用。刘邦军至南郑时韩信逃走，萧何月下追回。刘邦问：'何为追信？'萧何称'国士无双'，刘邦筑坛拜韩信为大将。'萧何月下追韩信'为识才用才的千古佳话。"},
    {period:"还定三秦",title:"明修栈道暗度陈仓",desc:"伴装修栈道迷惑敌军，暗地潜出陈仓道，一举定三秦。'明修栈道，暗度陈仓'由此而来。"},
    {period:"背水一战",title:"破赵之战",desc:"率数万新募之兵击赵，'背水为阵'置死地而后生，大破赵军20万。赵将成安君溺死，韩信生擒赵王歇。'背水忘亡'成为鼓舞士气之典。"},
    {period:"十面埋伏",title:"垓下灭楚",desc:"楚汉攻下之战，韩信为前锋，布十面埋伏，四面楚歌，项羽走投无路自刎乌江。韩信为汉室立下不世之功。"},
    {period:"前196年",title:"被诛三族",desc:"刘邦疑韩信谋反，吕后与萧何设计诱其入宫，斩于长乐钟室，夷三族。'生死一知己（萧何），存亡两妇人（漂母、吕后）'，成也萧何败也萧何。"}
  ],
  works:[
    {name:"《韩信兵法》",period:"西汉",context:"相传韩信著有兵法，后汉书有录，惜多散佚。其军事思想为后世所宗。",quote:"置之死地而后生，置之亡地而后存。"},
    {name:"名言",period:"与刘邦论兵",context:"刘邦问韩信自己能带多少兵，答'不过十万'；问韩信能带多少，答'臣多多益善耳'。后用'多多益善'喻越多越好。",quote:"陛下不过能将十万，臣多多而益善耳。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"萧何",label:"萧何",
  intro:"西汉开国丞相、'汉初三杰'之一。沛县刀笔吏出身，辅刘邦定天下。入咸阳先收秦律令图书，'月下追韩信'，'成也萧何败也萧何'之典皆出其身。营建未央宫，定律令制度，奠定汉朝根基。",
  bg:"秦末群雄并起，刘邦以布衣取天下。萧何不事武功而以文治辅之：镇抚后方、举荐人才、建立制度。他与张良、韩信并称三杰，与曹参并称'萧曹'，是汉初治国的关键人物。",
  timeline:[
    {period:"约前257年",title:"出身",desc:"沛县（今江苏沛县）人。通晓文法，为沛县功曹，与刘邦、曹参、樊哙等交好。"},
    {period:"从刘邦",title:"沛县起事",desc:"刘邦起兵后，萧何为丞相，总理军务，负责征讨调度。"},
    {period:"先收图书",title:"入咸阳尽取图籍",desc:"刘邦入咸阳，诸将皆争金帛财物，独萧何先收秦丞相御史律令图书藏之。日后汉王以此具知天下厄塞、户口多少、强弱之处，'萧何收图籍'为治国远识。"},
    {period:"月下追韩",title:"荐韩信",desc:"韩信不见用而逃，萧何连夜追回，向刘邦力荐，筑坛拜将。汉之灭楚，韩信之功居多，而荐之者萧何。"},
    {period:"镇守关中",title:"治国有方",desc:"刘邦与项羽争天下，萧何留守关中，转漕给军，供给不绝。定律令，营未央宫，与民休息，奠定西汉制度。"},
    {period:"约前193年",title:"去世",desc:"封酂侯。惠帝时病逝，谥'文终侯'。临终推荐曹参为相，'萧规曹随'成治国典范。而韩信之死，亦是萧何与吕后共谋，故有'成也萧何，败也萧何。'" }
  ],
  works:[
    {name:"《九章律》",period:"汉初",context:"萧何摘取秦律适宜者，制定《九章律》九篇，是汉代基本法典，奠定汉律体系。",quote:"萧规曹随，无为而治。"},
    {name:"治国",period:"相国时期",context:"萧何为稳定天下、休养生息制定了大量制度，被后世誉为'一代功曹'。",quote:"成也萧何，败也萧何。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"卫青",label:"卫青（长平侯）",
  intro:"西汉名将、大司马大将军。本为平阳公主骑奴，因姊卫子夫得幸武帝而崭露头角。七次出击匈奴，'龙城大捷'首破匈奴，收复河南地。外甥霍去病亦为名将，甥舅二人并称当世双璧。",
  bg:"西汉自高祖受困白登之耻后，对匈奴长期和亲忍让。武帝即位，国力强盛，决心转守为攻。卫青作为统帅，打破匈奴骑兵不败的神话，扭转了汉匈百年攻守态势。",
  timeline:[
    {period:"约前150年",title:"出身卑微",desc:"河东平阳（今山西临汾）人。父郑季与平阳公主府奴婢卫媪私通，生卫青。少时为平阳侯家骑奴，后为平阳公主邑人。"},
    {period:"龙城之战",title:"首破匈奴",desc:"前129年，卫青率万骑四路出击。三路无功，独卫青直捣龙城，斩首虏数千。此为汉对匈奴首次正面大捷，'龙城'遂成汉朝威名之典。"},
    {period:"收复河南",title:"取河南地",desc:"前127年，率军出云中，迂回至陇西，收复河南地，置朔方郡。此役使汉朝获得反击匈奴的战略前哨。"},
    {period:"漠北之战",title:"为大将军",desc:"前119年，与霍去病分路出击漠北，歼灭匈奴主力。卫青率部大破单于本阵，直抵真颜山。官拜大司马大将军。"},
    {period:"不孙功臣",title:"虚怀若谷",desc:"虽有大功，然为人谦让，'为人宽厚，仁善退让，以和柔自媚于上'，不以身为统帅而骄傲。力戒子弟骄奢。"},
    {period:"前106年",title:"去世",desc:"卒后陪葬茂陵。其甥霍去病先卒，甥舅二人墓冢相望，象征汉朝武功之盛。"}
  ],
  works:[
    {name:"《卫将军骠骑列传》",period:"后世所载",context:"司马迁《史记》所记卫青、霍去病事迹。卫青虽出身微贱，终成一代名将。",quote:"卫青、霍去病皆以外戚亲幸，然颇用材能自进。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"霍去病",label:"霍去病（冠军侯）",
  intro:"西汉名将、大司马骠骑将军，一代战神。17岁首战功冠全军，19岁封'冠军侯'，21岁封狼居胥。'匈奴未灭，何以家为'的名言流传千古。23岁英年早逝，令无数人扼腕叹息。",
  bg:"卫青、霍去病甥舅同掌汉军。霍去病善骑射，用兵快捷，大迂回、大穿插，深入漠北数千里。他所处的正是汉匈决战、汉朝由守转攻的巅峰时代。",
  timeline:[
    {period:"前140年",title:"出身",desc:"河东平阳人，卫青外甥，卫皇后姊子。善骑射，少年时随卫青出征。"},
    {period:"17岁",title:"首战封冠军",desc:"前123年，霍去病17岁随军出征，率轻骑八百，远距离奔袭，斩获甚多。武帝封其为'冠军侯'，意为战功冠于全军。"},
    {period:"河西之战",title:"收河西",desc:"前121年，两次出击河西，大破匈奴浑邪王、休屠王，收复河西走廊，打通西域要道。匈奴悲歌：'失我祁连山，使我六畜不蕃息。'"},
    {period:"封狼居胥",title:"漠北封山",desc:"前119年，与卫青分路出击漠北。霍去病率军深入两千余里，大破匈奴左贤王，登狼居胥山筑坛祭天，史称'封狼居胥'。此为中国古代武将的最高武功象徵。"},
    {period:"匈奴未灭",title:"何以家为",desc:"武帝为其建府第，霍去病辞谢：'匈奴未灭，何以家为！'——豪气干云，为万世名将典范。"},
    {period:"前117年",title:"英年早逝",desc:"23岁暴病而逝。武帝哀悼，发属国玄甲军送葬，陪葬茂陵，其墓冢形如祁连山，以彰其功。"}
  ],
  works:[
    {name:"漠北战功",period:"军功",context:"霍去病用兵敢于深入、出其不意，所向披靡。是青年才俊建立不世功业、马革裹尸的典范。",quote:"匈奴未灭，何以家为！"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"周亚夫",label:"周亚夫（条侯）",
  intro:"西汉名将，绛侯周勃之子。治军严整，'细柳劳军''不奉诏'之典流传。平定七国之乱立下不世之功，封条侯。后因刚直犯上，受屈下狱绝食而亡。",
  bg:"西汉初年，匈奴频频犯边，文帝亲自劳军。天下皆讥细柳营军令森严，独周亚夫以治军有方名闻朝野。后吴楚七国叛乱，汉景帝重用周亚夫，三月平叛，奠定中央集权。",
  timeline:[
    {period:"约前199年",title:"出身",desc:"沛县人，绛侯周勃次子。袭父爵初为河内守，后为御史大夫、将军。"},
    {period:"细柳劳军",title:"治军严明",desc:"文帝后六年，匈奴大举犯边。文帝劳军至细柳营，见甲士皆持满括，弓弩不控。皇帝入营也得按规矩乘车徐行。文帝叹：'此真将军矣！'周亚夫治军，连皇帝也不奉诏，'细柳营'遂成军纪表率。"},
    {period:"平叛七国",title:"太尉平乱",desc:"景帝三年，吴楚七国叛乱。周亚夫为太尉，屯兵荥阳，坚壁清野，断敌粮道，三个月平乱。诸将皆服其智勇。"},
    {period:"位列三公",title:"任丞相",desc:"平叛后功封条侯，任丞相。然为人刚直，不避权贵。"},
    {period:"受诬下狱",title:"绝食而亡",desc:"因反对立王夫人为后、反对封外戚，获罪景帝。廷尉迫供，周亚夫绝食五日而卒。一代名将以悲剧收场。"}
  ],
  works:[
    {name:"细柳营",period:"治军",context:"'细柳营'后成为治军严明的代名词。周亚夫文帝劳军而按法行进，是'令行禁止、军纪如铁'的典范。",quote:"嗟乎，此真将军也！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。"}
  ]},

  {id:"qinhan",dynasty:"西汉",name:"苏武",label:"苏武（苏子卿）",
  intro:"西汉使者，'苏武牧羊'的千古忠臣。奉命出使匈奴被扣留，宁死不降，牧羊北海（贝加尔湖）十九载，持汉节不改。后归汉，被奉为忠贞气节的最高象征。'鸿雁传书'典故由此而来。",
  bg:"武帝时汉与匈奴连年征战，使节往来常受羁押。苏武出使遇变故被扣，匈奴欲降之。他用生命守护'气节'二字，十九年风雪不改其节，成为中华民族气节精神的化身。",
  timeline:[
    {period:"前140年",title:"出身",desc:"杜陵（今西安）人，苏建之子。少随父在边，忠厚有节。"},
    {period:"前100年",title:"出使匈奴",desc:"武帝遣苏武以中郎将持节出使匈奴，送还匈奴留汉使者。事毕匈奴谋反涉及苏武副使，苏武被扣。"},
    {period:"受辱不降",title:"卫律劝降",desc:"匈奴用卫律劝降，苏武曰：'屈节辱命，虽生何面目以归汉！'引佩刀自刺，气绝而复息。匈奴敬其节操。"},
    {period:"北海牧羊",title:"十九年风雪",desc:"匈奴将其流放北海无人处放羊，给'公羊使产羔'才能归。苏武掘野鼠、食草实，杖汉节牧羊，卧起操持，节旄尽落。"},
    {period:"李陵劝降",title:"宁死不从",desc:"李陵降匈奴后受命劝苏武。苏武曰'愿勿复再言'。李陵羞惭而去，叹'今足下还归，扬名于匈奴，功显于汉室，虽古竹帛所载，何以加兹！'"},
    {period:"前81年",title:"归汉",desc:"匈奴与汉和亲，苏武始得归汉。当世皆称'武以为上，于是画工画武像于麒麟阁'。十九年归国，须发尽白。宣帝立'麒麟阁十一功臣'，苏武列名其后。"}
  ],
  works:[
    {name:"苏武牧羊",period:"留胡十九年",context:"苏武以顽强的气节名垂青史。诗《苏武诗四首》（相传）托为其作，书写归汉离散之情。",quote:"男儿生世间，及壮当封侯。战伐有功业，焉能守旧丘？"},
    {name:"气节典范",period:"十九年坚守",context:"苏武牧羊北海，持节不改，被尊为忠贞报国、坚韧不拔的民族气节象征。",quote:"宁为忠节之士，不为偷生之人。"}
  ]},

  // ===== 三国 =====
  {id:"sanguo",dynasty:"三国·蜀",name:"诸葛亮",label:"诸葛亮",
  intro:"三国时期蜀汉丞相。隐居隆中，刘备三顾茅庐而出山，提出'隆中对'战略。辅佐刘备建立蜀汉，受托孤重任。五次北伐中原，最后病逝五丈原。被后世奉为忠臣楷模与智慧化身。",
  bg:"东汉末年天下大乱，群雄割据。赤壁之战后天下三分，刘备在诸葛亮辅佐下占据益州。然而蜀汉最弱小，面临曹魏巨大压力。诸葛亮秉持'汉贼不两立'的信念，以攻为守。",
  timeline:[
    {period:"181年",title:"生于琅琊",desc:"山东琅琊阳都（今临沂）人。少时父母双亡，随叔父诸葛玄辗转。"},
    {period:"17-27岁",title:"隐居隆中",desc:"隐居襄阳隆中（今湖北襄阳）。躬耕陇亩，好为《梁父吟》。自比管仲、乐毅，时人未之许。"},
    {period:"207年",title:"隆中对",desc:"刘备三顾茅庐。诸葛亮提出占据荆益、联吴抗曹、三分天下而后统一天下的战略规划。"},
    {period:"208年",title:"出使联吴",desc:"曹操南下，诸葛亮出使东吴，舌战群儒，促成孙刘联盟。赤壁之战大破曹军。"},
    {period:"221年",title:"辅佐称帝",desc:"助刘备在成都称帝，建立蜀汉。任丞相，总理国政。"},
    {period:"223年",title:"受托孤",desc:"白帝城托孤。刘备临终将儿子刘禅托付给诸葛亮，说'若嗣子可辅则辅之，如其不才，君可自取'。诸葛亮流泪发誓'鞠躬尽瘁，死而后已'。"},
    {period:"225年",title:"平定南中",desc:"南中叛乱，诸葛亮率军南征。七擒孟获，使南人归心，稳定后方。"},
    {period:"228-234年",title:"五次北伐",desc:"上《出师表》后开始北伐，先后五次出兵祁山。街亭失守后挥泪斩马谡。234年病逝于五丈原军中，享年54岁。"}
  ],
  works:[
    {name:"《出师表》",period:"227年北伐前",context:"第一次北伐前写给刘禅的奏表。字字恳切、句句忠心，既是政治遗嘱，也是人格宣言。被历代士人奉为忠臣范本。",quote:"鞠躬尽瘁，死而后已。"},
    {name:"《诫子书》",period:"晚年",context:"写给8岁儿子诸葛瞻的家书。全文仅86字，句句是人生智慧的结晶。",quote:"非淡泊无以明志，非宁静无以致远。"}
  ]},

  {id:"sanguo",dynasty:"曹魏",name:"嵇康",label:"嵇康（竹林七贤）",
  intro:"三国曹魏文学家、思想家、音乐家。'竹林七贤'的精神领袖。崇尚老庄、反对礼法，提出'越名教而任自然'。因拒绝出仕司马氏，被司马昭处死。临刑前索琴弹《广陵散》，从容赴死。",
  bg:"曹魏末年，司马氏专权，大肆屠杀曹魏宗室与异己文人。这是一个'名士少有全者'的恐怖时代。嵇康等人以饮酒清谈、放浪形骸来反抗虚伪的礼教与暴政。",
  timeline:[
    {period:"224年",title:"出身世家",desc:"谯郡铚县（今安徽淮北）人。曹操曾孙女婿。少有奇才，博览群书。"},
    {period:"青年",title:"拒入仕途",desc:"娶曹操曾孙女为妻，拜中散大夫，但无心政事。以打铁、灌园为乐。"},
    {period:"竹林交游",title:"竹林七贤",desc:"与阮籍、山涛、向秀、刘伶、阮咸、王戎七人常聚会于竹林之下，饮酒清谈。史称'竹林七贤'。"},
    {period:"拒绝出仕",title:"《与山巨源绝交书》",desc:"好友山涛（山巨源）举荐他出任吏部郎。嵇康写下著名的《与山巨源绝交书》，声明自己'非汤武而薄周孔'，拒绝出仕。"},
    {period:"262年",title:"被诬处死",desc:"因好友吕安被诬不孝，嵇康挺身为其作证。司马昭借机以'言论放荡，害时乱教'之罪将嵇康下狱。三千太学生上书请愿，不允。"},
    {period:"临刑",title:"《广陵散》绝响",desc:"临刑前神色不变，索琴弹《广陵散》。曲终叹曰：'《广陵散》于今绝矣！'从容就义，时年39岁。"}
  ],
  works:[
    {name:"《与山巨源绝交书》",period:"拒绝出仕时",context:"声明自己不愿做官的七大理由（七不堪、二不可），言辞犀利、嬉笑怒骂。既是对虚伪礼教的声讨，也是自由人格的宣言。",quote:"内不愧心，外不负俗，交不为利，仕不谋禄。"},
    {name:"《声无哀乐论》",period:"早年",context:"音乐美学论文，提出'声无哀乐'的观点——音乐本身没有情感，哀乐在于听者之心。见解独到，是中国音乐美学的经典。",quote:"心之与声，明为二物。"}
  ]},

  {id:"sanguo",dynasty:"蜀汉",name:"关羽",label:"关羽（关云长）",
  intro:"三国蜀汉名将，'五虎上将'之首，被历代尊为'武圣'。义薄云天，'温酒斩华雄''过五关斩六将''单刀赴会''刮骨疗毒'等典故流传千古。后人为其建庙祭祀，与孔子并称'文武二圣'。",
  bg:"东汉末群雄并起，刘备、关羽、张飞桃园结义，共图大业。关羽以忠义、神勇著称，其形象经《三国演义》的艺术塑造，成为中华文化中'忠义'的代名词。",
  timeline:[
    {period:"约160年",title:"出身",desc:"河东解良（今山西运城）人。早年亡命涿郡，遇刘备、张飞，三人'桃园结义'，情同手足。"},
    {period:"温酒斩华雄",title:"成名之战",desc:"董卓部下华雄连斩诸侯数将，无人敢应。关羽请战，曹操温酒为其壮行，酒尚温，关羽已斩华雄而还，'温酒斩华雄'尽显神勇。"},
    {period:"过五关斩六将",title:"千里寻兄",desc:"刘备兵败，关羽为保嫂暂降曹操。后闻刘备消息，封金挂印，护送二嫂离曹营，过五关斩六将，千里寻兄，忠义之极。"},
    {period:"刮骨疗毒",title:"谈笑自如",desc:"攻樊城中箭，毒入骨。神医华佗为其刮骨去毒，关羽与诸将弈棋谈笑自若，'刮骨疗毒'尽显英雄本色。"},
    {period:"大意失荆州",title:"败走麦城",desc:"因骄傲大意，吴将吕蒙袭取荆州，关羽腹背受敌，败走麦城，为吴所擒，凛然就义。'大意失荆州'成警世之训。"},
    {period:"身后尊荣",title:"封武圣",desc:"历代加封：宋徽宗封'义勇武安王'，明神宗封'三界伏魔大帝'，清代尊为'关圣大帝'。民间尊为'武财神'，与孔子'文圣'并称'武圣'。忠义精神深入民心。"}
  ],
  works:[
    {name:"《关羽》形象",period:"《三国演义》",context:"关羽义薄云天、有勇有谋的形象，是中国'忠义文化'的图腾。'义'为其立身之本。",quote:"人在曹营心在汉。"}
  ]},

  {id:"sanguo",dynasty:"蜀汉",name:"张飞",label:"张飞（张翼德）",
  intro:"三国蜀汉名将，'五虎上将'之一。与关羽并称'万人敌'。当阳桥上一声吼，'喝退曹军，折断桥'，尽显神勇。然性情暴躁，鞭打下属，终被部下所害，留下惨痛教训。",
  bg:"刘备从破黄巾起家，张飞与关羽自早年起便追随左右，冲锋陷阵。安得偃月刀、丈八蛇矛，兄弟三人在乱世中打下一片天地。",
  timeline:[
    {period:"约168年",title:"出身",desc:"涿郡（今河北涿州）人。与刘备、关羽桃园结义，'不求同年同月同日生，但求同年同月同日死'，情同手足。"},
    {period:"当阳桥",title:"长坂坡断桥",desc:"刘备兵败长坂坡，张飞据水断桥，怒目横矛，大呼'身是张益德也，可来共决死！'曹军无一人敢近。'当阳桥头一声吼'，威名震敌胆。"},
    {period:"义释严颜",title:"入川之勇",desc:"随刘备入川，往江州，生擒巴郡太守严颜。严颜曰'我州但有断头将军，无有降将军也'，张飞壮而释之，引为客人。"},
    {period:"智取葭萌",title:"开疆拓土",desc:"张飞镇守西部，为蜀汉巩固州郡。定巴西，擒守巴中。"},
    {period:"鞭挞士卒",title:"性格之失",desc:"张飞待人粗暴，动辄鞭打士卒，刘备尝戒之：'卿刑杀既过差，又日鞭挞健儿，而令在左右，此取祸之道也。'张飞不以为意。"},
    {period:"221年",title:"被部下所害",desc:"伐吴前，其帐下将张达、范彊随从怨之，乘夜杀张飞，携首投吴。张飞暴而无恩，终为部下所害。刘备闻之恸哭。追谥桓侯。"}
  ],
  works:[
    {name:"张飞形象",period:"《三国演义》",context:"张飞勇猛又有'豹头环眼、声如巨雷'的形象，为勇将代表。然'暴而无恩'的教训警示感尤深。",quote:"身是张益德也，可来共决死！"}
  ]},

  {id:"sanguo",dynasty:"东吴",name:"周瑜",label:"周瑜（周公瑾）",
  intro:"三国东吴都督，'江左周郎'。年少英才，与孙策结为异姓兄弟，助孙氏据江东。赤壁之战以火攻大败曹操，奠定三分天下。雅量高致，精通音律，'曲有误，周郎顾'。司马懿亦为其所敬畏。",
  bg:"东汉末年，江东孙氏崛起。周瑜少年即与孙策相识，共镇江东。曹操南征，黎民避难，周瑜临危受命，任大都督御守江左，火烧赤壁，一战成名。",
  timeline:[
    {period:"175年",title:"出身",desc:"庐江舒县（今安徽舒城）人。孙策好宾客，周瑜倾其家财以资之。二人同年，结为兄弟。"},
    {period:"助孙氏",title:"镇江东",desc:"孙策起兵，周瑜以其部曲从之，平定江东。孙策赞'公瑾有瑜瑾之美'。"},
    {period:"赤壁之战",title:"火烧赤壁",desc:"208年，曹操率大军南下。周瑜为前部大都督，采纳黄盖火攻之策，以火船破曹军战船，大败曹操。此战奠定了天下三分的格局，周瑜一夜之间势震华夏。"},
    {period:"敦促进取",title:"谋定荆州",desc:"赤壁后乘胜进击，取南郡。周瑜进言孙权'得方城魏，然北操惴惴'，为东吴立下汗马功劳。"},
    {period:"210年",title:"病逝",desc:"周瑜欲图取蜀，途中病卒于巴丘，年仅36岁。孙权痛曰：'公瑾有王佐之资，今忽短命，孤何赖哉！'诸葛亮的'既生瑜何生亮'是小说家言，实为后人附会之语。"}
  ],
  works:[
    {name:"周郎顾曲",period:"音乐造诣",context:"周瑜精通音律，即使醉酒也能听出乐工的一个错音，会回头看演奏者，因'曲有误，周郎顾'。堪称文武双全的儒将。",quote:"曲有误，周郎顾。"},
    {name:"赤壁残碑",period:"后世凭吊",context:"苏轼《念奴娇·赤壁怀古》凭吊的'小乔初嫁了，雄姿英发'，正是周瑜。",quote:"羽扇纶巾，谈笑间，樯橹灰飞烟灭。"}
  ]},

  {id:"sanguo",dynasty:"曹魏",name:"司马懿",label:"司马懿",
  intro:"三国魏国权臣，西晋奠基者。辅佐曹氏四代，沉稳老辣。'空城计''死诸葛吓走活仲达'等演义故事，使其成为权谋的象征。终夺魏权，其孙司马炎代魏建晋。",
  bg:"三国后期，魏蜀吴鼎立而魏最强。魏国权臣司马懿辅政，与曹氏宗室明争暗斗，最终通过'高平陵之变'清除政敌，掌控魏国军政大权，为晋代魏奠定基础。",
  timeline:[
    {period:"179年",title:"出身",desc:"河内温县（今河南温县）人。少有谋略，'内忌而外宽，猜忌多权变'。曹操欲辟其为官，司马懿称病推辞。曹操以强制手段，司马懿方出仕。"},
    {period:"辅佐曹操",title:"入仕曹魏",desc:"曹操时任文学掾．后任丞相主簿。曹操知其'有雄豪志'，告诫曹丕'此人不为人所制矣'。"},
    {period:"对抗诸葛",title:"抗魏拒蜀",desc:"诸葛亮北伐，魏主用司马懿。司马懿深沟高垒、坚壁不战，用持久战拖垮蜀军。'空城计''木牛流马'皆出于此段演义。诸葛亮病逝五丈原后，司马懿叹'吾能料生，不能料死'。"},
    {period:"高平陵之变",title:"夺取大权",desc:"249年，趁曹爽兄弟陪同少帝祭陵，司马懿发动政变，控制洛阳，诛灭曹爽集团。曹魏大权尽归司马氏。"},
    {period:"251年",title:"病逝",desc:"去世后，其子司马师、司马昭相继掌权，孙司马炎于266年代魏称帝，建立西晋。司马懿被追尊为宣皇帝。'三马同槽'预言成真。"}
  ],
  works:[
    {name:"《晋书·宣帝纪》",period:"后世",context:"司马懿隐忍待发、老谋深算的形象，在《三国演义》中与诸葛亮斗智，成为权谋成功的象征。",quote:"夫欲进，必先使之退；欲疾，必先使之徐。"}
  ]},

  // ===== 两晋南北朝 =====
  {id:"liangjin",dynasty:"东晋",name:"陶渊明",label:"陶渊明",
  intro:"中国第一位田园诗人。曾任彭泽县令八十余天，因不愿'为五斗米折腰'弃官归隐。诗风自然冲淡、意境高远，开创田园诗派。对后世李白、杜甫、苏轼等影响深远。",
  bg:"东晋末年政治腐败、社会动荡。桓玄篡位、刘裕兴起，战乱不断。士大夫阶层热衷于门阀斗争。陶渊明选择'归去来兮'，以躬耕田园的方式保持人格独立。",
  timeline:[
    {period:"365年",title:"出身官宦之家",desc:"浔阳柴桑（今江西九江）人。曾祖陶侃为东晋大司马。但到陶渊明时家道已衰落。"},
    {period:"29岁",title:"初入仕途",desc:"出任江州祭酒。因不堪吏职之苦，不久即辞归。"},
    {period:"36-40岁",title:"辗转为官",desc:"先后任桓玄、刘裕、刘敬宣等人的幕僚。目睹官场黑暗，内心矛盾重重。"},
    {period:"41岁",title:"归隐田园",desc:"任彭泽县令仅80余天。郡遣督邮至，县吏告其应束带见之。陶渊明叹：'吾不能为五斗米折腰，拳拳事乡里小人邪！'即日解印去职。作《归去来兮辞》。"},
    {period:"42-62岁",title:"躬耕南亩",desc:"归隐后亲自耕种，虽然'草盛豆苗稀'、'家贫不能恒得'，甚至乞食，但内心自由安宁。"},
    {period:"427年",title:"病逝",desc:"在贫病交加中去世，享年63岁。私谥'靖节'。好友颜延之等为其作诔。"}
  ],
  works:[
    {name:"《桃花源记》",period:"归隐后期",context:"虚构了一个'不知有汉，无论魏晋'的理想世界。桃花源是中国人心中永远的乌托邦。写此篇时正值刘宋篡晋，寄托了对乱世的失望与对和平的向往。",quote:"黄发垂髫，并怡然自乐。"},
    {name:"《归去来兮辞》",period:"辞彭泽令时",context:"归隐的宣言书。'归去来兮，田园将芜胡不归'——对官场说再见，对自由说你好。欧阳修说：'晋无文章，惟《归去来兮辞》而已。'",quote:"悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。"},
    {name:"《饮酒·其五》",period:"归隐后",context:"在田园生活中悟出了'此中有真意'的人生境界。'采菊东篱下'已成为中国文人精神自由的最高象征。",quote:"采菊东篱下，悠然见南山。"}
  ]},

  {id:"liangjin",dynasty:"东晋",name:"祖逖",label:"祖逖",
  intro:"东晋名将，北伐先锋。'闻鸡起舞''中流击楫'两大典故源于其身。率部渡江北伐，收复黄河以南大片失土。因晋廷猜忌、内忧外患，壮志未酬，忧愤而卒。",
  bg:"五胡乱华，晋室南渡偏安江南。民族危亡之际，祖逖立志北伐、光复中原。然而晋朝内部纷争不断，对北伐推诿掣肘。祖逖以私人武装北伐，一度收复豫州，终因无人支持而失败。",
  timeline:[
    {period:"266年",title:"出身",desc:"范阳遒县（今河北涞水）人。晋朝士族之后。少孤，素有大志。"},
    {period:"闻鸡起舞",title:"立志报国",desc:"早年与刘琨同寝，夜闻鸡鸣，祖逖蹴刘琨曰：'此非恶声也。'即起舞练剑。'闻鸡起舞'自此比喻志士勤勉自励。"},
    {period:"中流击楫",title:"渡江北伐",desc:"307年，晋室南渡。祖逖率部曲百家渡长江，船至中流，击楫而誓曰：'祖逖不能清中原而复济者，有如大江！'慷慨激昂，'中流击楫'为壮志报国之名典。"},
    {period:"收复失土",title:"北定豫州",desc:"在豫州（今河南）一带连年征战，收复黄河以南、今豫东鲁南失地。东晋北境军队皆受其节度。"},
    {period:"壮志难酬",title:"忧愤而卒",desc:"眼见东晋内乱、王敦又起兵逼建康，祖逖忧愤成疾，321年病卒于雍丘。其弟祖约代领其众，竟转而任坐镇，北伐功亏一篑，中原复失。"}
  ],
  works:[
    {name:"北伐名言",period:"渡江时",context:"祖逖以闻鸡起舞、中流击楫的伟志，激励了一代代志士。其北伐虽败，气节长存。",quote:"祖逖不能清中原而复济者，有如大江！"}
  ]},

  {id:"liangjin",dynasty:"东晋",name:"王羲之",label:"王羲之（王右军）",
  intro:"东晋书法家，被尊为'书圣'。任右军将军，世称'王右军'。书风遒媚劲健，'飘若浮云，矫若惊龙'。《兰亭集序》被誉为'天下第一行书'。'入木三分''坦腹东床''曲水流觞'等典出于其身。",
  bg:"魏晋时期社会动荡，玄学清谈、书法艺术盛行。士族门阀把持政治。王羲之出身琅琊王氏，才华横溢，却不慕权贵，以书法与潇洒人格名世。",
  timeline:[
    {period:"303年",title:"出身名门",desc:"琅琊临沂（今山东临沂）人，后南渡居会稽。父王旷。自幼擅书法，'书圣'之名源于此。"},
    {period:"坦腹东床",title:"东床快婿",desc:"太尉郗鉴遣门人至王家求婿。诸郎皆打扮整齐，独王羲之在东床坦腹而食，若无其事。郗鉴闻之曰'此真吾婿也'，遂妻以女。'坦腹东床'喻真率坦荡。"},
    {period:"书圣之名",title:"入木三分",desc:"相传王羲之书于木板，迹至入木三分。'入木三分'形容力道之深，后喻议论深刻。其书法渐进步，终达'尽极之妙'。"},
    {period:"曲水流觞",title:"《兰亭集序》",desc:"353年上巳节，与友人谢安等宴集于山阴兰亭，曲水流觞，饮酒赋诗。王羲之乘酒兴为诗集作序，即《兰亭集序》。笔势遒媚劲健，浑然天成，被誉为'天下第一行书'。此为书法史第一大典。"},
    {period:"晚年",title:"辞官归隐",desc:"厌恶官场，挂冠归隐。游弋山水，以书法自娱。卒后，其子王献之亦为书法大家，合称'二王'。"}
  ],
  works:[
    {name:"《兰亭集序》",period:"353年",context:"行书巅峰，28行324字。'萧然趣逸'，如行云流水。相传唐太宗爱之，命摹本传世。宋人称之为'天下第一行书'。",quote:"是日也，天朗气清，惠风和畅……固知一死生为虚诞，齐彭殇为妄作。"},
    {name:"书圣书法",period:"一生",context:"王羲之变革汉魏书风，吸收秦汉篆隶之韵，创出清新俊逸的行草，为后世树立典范。",quote:"飘若浮云，矫若惊龙。"}
  ]},

  {id:"liangjin",dynasty:"东晋",name:"谢安",label:"谢安（谢太傅）",
  intro:"东晋名相、政治家、军事家、书法家。隐于东山，'东山再起'出仕，主持朝政。淝水之战前镇定自若，以'围棋赌墅''下棋如故'的气度大败前秦苻坚百万大军。使东晋转危为安。",
  bg:"十六国时期前秦苻坚统一北方，率百万大军南下，欲一举灭晋。谢安任征讨大都督，坐镇建康，沉着应战。淝水一战，前秦大败而崩，东晋得以偏安。",
  timeline:[
    {period:"320年",title:"出身",desc:"陈郡阳夏（今河南太康）人，出身陈郡谢氏名门。思想清雅，善玄言，好读书，晓音乐。"},
    {period:"东山隐居",title:"高卧东山",desc:"累辞官职，隐居于会稽东山，与王羲之等名士游宴山水，'东山高卧'为其谦退之志。"},
    {period:"东山再起",title:"出仕为相",desc:"年过四旬，国难当头，谢安应征出仕，官至中书监、录尚书事，执掌朝政。'东山再起'由此形容重新出仕。"},
    {period:"淝水之战",title:"一战定国",desc:"383年，苻坚率号称百万之众南犯。谢安任大都督，遣谢玄等率北府兵八万八千迎战。决战前谢安却与人对弈围棋、登山别墅，从容镇定，'围棋赌墅'传为佳话。淝水大捷，前秦一溃千里，风声鹤唳、草木皆兵。"},
    {period:"功高遭忌",title:"出镇广陵",desc:"淝水之战后谢安功高震主。会稽王司马道子妒忌，谢安自请出镇广陵，远离中枢。385年病逝，追赠太傅。"}
  ],
  works:[
    {name:"谢氏家训",period:"为相",context:"谢安以'雅量'著称，其'泰山崩于前而色不变'的气度，成淝水之战的定海神针。",quote:"淝水之战，安石不出，如苍生何！"},
    {name:"安石不出",period:"淝水之胜",context:"淝水之战的胜利，使谢安成为安定江左的第一功臣。后世'谢安绝世风流'，为其风雅与功业之誉。",quote:"胜败兵家事不期，包羞忍耻是男儿。"}
  ]},

  // ===== 隋唐 =====
  {id:"suitang",dynasty:"初唐",name:"王勃",label:"王勃",
  intro:"初唐四杰之首，六岁能文，十六岁进士及第，是唐朝最年轻的官员之一。因《檄英王鸡文》被逐出沛王府，后因杀官奴案被除名。南下省父时写下千古名篇《滕王阁序》，返途溺水惊悸而卒，年仅26岁。",
  bg:"初唐是中国诗歌从六朝绮靡向盛唐气象过渡的关键时期。王勃等人以刚健清新的文风打破了齐梁以来的浮艳文风，为唐诗开辟了新天地。",
  timeline:[
    {period:"约650年",title:"神童出世",desc:"出身儒学世家，祖父王通是隋末大儒。六岁善文辞，被赞为'神童'。"},
    {period:"9岁",title:"指瑕《汉书》",desc:"读颜师古注《汉书》，即能指出其中错误，作《指瑕》十卷。"},
    {period:"666年",title:"进士及第",desc:"应幽素科试及第，授朝散郎，年仅16岁。成为当时最年轻的官员。"},
    {period:"沛王府",title:"《檄英王鸡文》",desc:"任沛王府修撰，因戏作《檄英王鸡文》为沛王与英王斗鸡助兴，高宗认为是挑拨皇子关系，将其逐出王府。"},
    {period:"虢州参军",title:"杀奴案",desc:"补虢州参军，因藏匿并杀死官奴曹达，按律当斩。逢大赦免死，但被除名。其父受牵连贬谪交趾。"},
    {period:"675年",title:"滕王阁盛会",desc:"南下探望父亲，途经洪州（今南昌）。适逢阎都督重修滕王阁，宴请文人。王勃即席作《滕王阁序》，满座皆惊。"},
    {period:"约676年",title:"溺水而卒",desc:"返程渡海时遇风暴溺水，惊悸而卒。年仅26岁。一颗文坛巨星转瞬即逝。"}
  ],
  works:[
    {name:"《滕王阁序》",period:"675年",context:"即席而作，一气呵成。773字骈文，对仗精工、辞采华丽。'落霞与孤鹜齐飞，秋水共长天一色'一出，阎公惊叹'此真天才，当垂不朽'。",quote:"落霞与孤鹜齐飞，秋水共长天一色。"},
    {name:"《送杜少府之任蜀州》",period:"长安时期",context:"送别诗中的千古绝唱。与一般送别诗的愁苦不同，王勃以豁达胸襟写出友情的力量。",quote:"海内存知己，天涯若比邻。"}
  ]},

  {id:"suitang",dynasty:"盛唐",name:"李白",label:"李白",
  intro:"'诗仙'，唐代最伟大的浪漫主义诗人。一生好酒、好剑、好游历，足迹遍及大半个中国。诗风豪放飘逸、想象瑰丽，存诗近千首。贺知章读其《蜀道难》惊呼其为'谪仙人'。",
  bg:"盛唐是中国封建社会的巅峰，国力强盛、文化繁荣、中外交流频繁。李白生活于开元盛世与安史之乱之间，他的一生正是大唐由盛转衰的见证。",
  timeline:[
    {period:"701年",title:"出生",desc:"一说生于碎叶城（今吉尔吉斯斯坦），今甘肃天水李氏后裔。五岁随父迁居四川绵州。"},
    {period:"少年",title:"读书与游侠",desc:"'五岁诵六甲，十岁观百家'。喜纵横术、好剑术，曾'手刃数人'。"},
    {period:"25岁",title:"仗剑去国",desc:"离开四川，'仗剑去国，辞亲远游'。沿长江而下，在江陵遇道士司马承祯，在金陵散金三十万。"},
    {period:"30-42岁",title:"漫游与求仕",desc:"十年漫游，访道求仙。在长安与贺知章相遇，贺见其《蜀道难》称其'谪仙人'。"},
    {period:"742年",title:"供奉翰林",desc:"经玉真公主、贺知章推荐，被唐玄宗召入长安，任翰林供奉。但因性格狂放，得罪权贵。"},
    {period:"744年",title:"赐金放还",desc:"遭高力士、杨贵妃等人谗言，被玄宗赐金放还。在洛阳与杜甫相遇，结下千古友情。"},
    {period:"755年",title:"安史之乱",desc:"安史之乱爆发，李白隐居庐山。后误入永王李璘幕府，永王兵败后李白被流放夜郎。"},
    {period:"762年",title:"病逝当涂",desc:"流放途中遇大赦，写下'朝辞白帝彩云间'。回返后寄居族叔李阳冰处，病逝于当涂（今安徽马鞍山），享年61岁。"}
  ],
  works:[
    {name:"《将进酒》",period:"被排挤后（752年）",context:"'天生我材必有用'——在被排挤出长安后写下此诗。表面是劝酒，实则是与命运干杯。豪放中藏悲愤，狂歌里见洒脱。",quote:"天生我材必有用，千金散尽还复来。"},
    {name:"《静夜思》",period:"漫游期间",context:"极简而极深。二十个字写尽了游子对家乡的眷恋。流传最广的中国古诗之一。",quote:"床前明月光，疑是地上霜。举头望明月，低头思故乡。"},
    {name:"《蜀道难》",period:"入长安前",context:"以神话般的想象描写蜀道的艰险，实则暗喻仕途之难。贺知章读后惊呼其为'谪仙人'。",quote:"蜀道之难，难于上青天！"},
    {name:"《早发白帝城》",period:"遇赦返程时（759年）",context:"流放夜郎途中遇大赦，从白帝城返回江陵。心情之畅快跃然纸上，是李白生命最后阶段的光芒之作。",quote:"两岸猿声啼不住，轻舟已过万重山。"}
  ]},

  {id:"suitang",dynasty:"盛唐→中唐",name:"杜甫",label:"杜甫",
  intro:"'诗圣'，其诗被誉为'诗史'。出身官宦世家，一生颠沛流离。目睹国家由盛转衰，经历了安史之乱的全过程。诗歌沉郁顿挫，深刻反映社会现实，被誉为'诗史'。与李白并称'李杜'。",
  bg:"杜甫的一生与大唐由盛转衰完全同步。他出生于开元盛世，亲历了安史之乱（755-763年），见证了长安陷落、百姓流离。他的诗就是一部用血泪写成的唐史。",
  timeline:[
    {period:"712年",title:"生于盛唐",desc:"河南巩县（今巩义）人。祖父杜审言为初唐著名诗人。'七龄思即壮，开口咏凤凰'。"},
    {period:"20-35岁",title:"漫游吴越齐赵",desc:"青年时期漫游各地。在洛阳与李白相遇，同游梁宋。"},
    {period:"746-755年",title:"困守长安十年",desc:"赴长安求仕，屡试不第。向玄宗献三大礼赋，才被授予河西尉（不就），后改右卫率府胄曹参军。十年困顿，'残杯与冷炙，到处潜悲辛'。"},
    {period:"755年",title:"安史之乱",desc:"安史之乱爆发，杜甫携家逃难。将家安置鄜州后只身投奔肃宗，途中被叛军俘获押回长安，在长安困居八个月。"},
    {period:"757年",title:"冒死投奔",desc:"冒险逃出长安，'麻鞋见天子，衣袖露两肘'。被肃宗任命为左拾遗。但因疏救房琯触怒肃宗。"},
    {period:"759年",title:"弃官入蜀",desc:"对朝廷失望，弃官西行。经秦州、同谷入蜀。在成都西郊浣花溪畔建草堂，过了四年相对安定的生活。"},
    {period:"768-770年",title:"漂泊湖湘",desc:"离蜀后辗转于夔州、江陵、岳阳、潭州。768年到岳阳，登岳阳楼。770年冬病逝于湘江舟中，享年58岁。"}
  ],
  works:[
    {name:"《春望》",period:"757年被困长安",context:"被叛军困在沦陷的长安城中，春草萋萋却满目疮痍。家国破碎之痛入骨。",quote:"国破山河在，城春草木深。感时花溅泪，恨别鸟惊心。"},
    {name:"'三吏三别'",period:"759年",context:"由洛阳回华州途中，亲眼目睹官吏抓丁、百姓生离死别的惨状。包括《新安吏》《石壕吏》《潼关吏》《新婚别》《垂老别》《无家别》。是'诗史'的代表作。",quote:"夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。"},
    {name:"《茅屋为秋风所破歌》",period:"761年成都",context:"一场秋风吹破了他的草堂。自己已如此困苦，心中想的却是天下寒士。这是杜甫最伟大的人格光辉。",quote:"安得广厦千万间，大庇天下寒士俱欢颜！"},
    {name:"《登岳阳楼》",period:"768年",context:"漂泊到岳阳，登上岳阳楼。个人漂泊之痛与国家动荡之悲交织在一起。老病孤舟中，依然心系苍生。",quote:"戎马关山北，凭轩涕泗流。"}
  ]},

  {id:"suitang",dynasty:"中唐",name:"白居易",label:"白居易",
  intro:"唐代三大诗人之一，倡导'新乐府运动'，主张'文章合为时而著，歌诗合为事而作'。诗风通俗平易，老妪能解。早年仕途得意，晚年居洛阳香山，号'香山居士'。",
  bg:"安史之乱后，中唐社会矛盾尖锐，藩镇割据、宦官专权、民生凋敝。白居易继承杜甫的现实主义精神，以诗歌反映社会问题。他与元稹都主张诗歌要有社会功用。",
  timeline:[
    {period:"772年",title:"出生于新郑",desc:"河南新郑人。生于中唐。少年时因战乱避居外地，亲身感受民间疾苦。"},
    {period:"800年",title:"进士及第",desc:"28岁中进士，名列第四。后任翰林学士、左拾遗，直言敢谏。"},
    {period:"806年",title:"写《长恨歌》",desc:"与友人陈鸿等同游仙游寺，感于唐明皇与杨贵妃故事，创作《长恨歌》。全诗120句，哀婉动人。"},
    {period:"810年",title:"倡导新乐府",desc:"任拾遗期间，与元稹倡导新乐府运动，写作大量反映民生疾苦的讽喻诗，如《卖炭翁》《杜陵叟》等。"},
    {period:"815年",title:"贬为江州司马",desc:"因上疏请求严缉刺杀宰相的凶手，被政敌陷害，贬为江州司马。途中作《琵琶行》，'同是天涯沦落人'道尽失意心境。"},
    {period:"827年后",title:"定居洛阳",desc:"历任杭州、苏州刺史，政绩卓著。晚年定居洛阳香山，与诗友唱和，号'香山居士'，颐养天年。"},
    {period:"846年",title:"病逝",desc:"在洛阳逝世，享年74岁。唐宣宗作诗吊唁：'童儿能吟长恨歌，胡儿能歌琵琶篇。'"}
  ],
  works:[
    {name:"《长恨歌》",period:"806年",context:"叙写唐明皇与杨贵妃的爱情悲剧，'在天愿作比翼鸟，在地愿为连理枝'。哀艳动人，流传千古。",quote:"天长地久有时尽，此恨绵绵无绝期。"},
    {name:"《琵琶行》",period:"815年贬江州",context:"浔阳江头送客，偶遇一琵琶女。'同是天涯沦落人，相逢何必曾相识'——由琵琶女的身世联想到自己的遭遇，道尽仕途失意之悲。",quote:"同是天涯沦落人，相逢何必曾相识。"},
    {name:"《卖炭翁》",period:"新乐府时期",context:"'满面尘灰烟火色，两鬓苍苍十指黑'的卖炭老人，被宫使强夺炭车。控诉对百姓的残酷盘剥。新乐府运动的代表作。",quote:"可怜身上衣正单，心忧炭贱愿天寒。"}
  ]},

  {id:"suitang",dynasty:"中唐",name:"韩愈",label:"韩愈",
  intro:"'唐宋八大家'之首，古文运动领袖。力排佛老，提倡'文以载道'。官至吏部侍郎，因谏迎佛骨被贬潮州。诗歌散文化，风格奇崛雄浑。苏轼评价'文起八代之衰，道济天下之溺'。",
  bg:"中唐时期佛老盛行，骈文绮靡空洞。韩愈倡导古文运动，主张恢复先秦两汉质朴的散文传统，以'道'统摄文辞。这一运动影响深远，一直持续到宋代。",
  timeline:[
    {period:"768年",title:"出生",desc:"河南河阳（今孟州）人。自称'郡望昌黎'，世称'韩昌黎'。三岁丧父，由兄嫂抚养。"},
    {period:"789年",title:"屡试不第",desc:"多次应进士试不第，羁旅长安。作《马说》：'世有伯乐，然后有千里马。'24岁终于中进士。"},
    {period:"793-800年",title:"入幕府",desc:"中进士后久无官职，先后在汴州、徐州幕府任职。'三上宰相书'自荐。"},
    {period:"806-813年",title:"回朝任职",desc:"归朝后历官国子博士、都官员外郎等职。因多次直言敢谏，屡遭贬斥。"},
    {period:"814年",title:"谏迎佛骨",desc:"唐宪宗迎佛骨入宫供奉，韩愈上《论佛骨表》力谏，触怒宪宗，被贬为潮州刺史。途中作《左迁至蓝关示侄孙湘》。"},
    {period:"819年",title:"潮州政绩",desc:"在潮州任上兴办州学、驱除鳄鱼，深得民心。潮州人感念其恩德，将当地山水命名为'韩山''韩江'。"},
    {period:"824年",title:"病逝",desc:"任吏部侍郎后不久病逝于长安，享年57岁。追赠礼部尚书。"}
  ],
  works:[
    {name:"《师说》",period:"790年前后",context:"针对当时'耻学于师'的风气，论证从师学习的重要性。'弟子不必不如师，师不必贤于弟子。'流传最广的韩愈名篇之一。",quote:"师者，所以传道受业解惑也。"},
    {name:"《进学解》",period:"任国子博士时",context:"以答问形式论述治学之道。'业精于勤，荒于嬉；行成于思，毁于随。'劝学名句。",quote:"业精于勤，荒于嬉；行成于思，毁于随。"},
    {name:"《左迁至蓝关示侄孙湘》",period:"819年被贬潮州",context:"韩愈晚年因此谏被贬，行至蓝关（今陕西蓝田）。侄孙韩湘来送别，韩愈慨然赋诗。苍凉悲壮，肝胆俱裂。",quote:"云横秦岭家何在，雪拥蓝关马不前。"}
  ]},

  {id:"suitang",dynasty:"晚唐",name:"李商隐",label:"李商隐",
  intro:"晚唐最杰出的诗人之一，与杜牧合称'小李杜'。诗歌深情婉转、意境朦胧，以无题诗最为著名。一生困于牛李党争，郁郁不得志。其'夕阳无限好，只是近黄昏'句，成为晚唐的象征。",
  bg:"晚唐国势衰微，宦官专权，牛李党争激烈。李商隐一生夹在两大党派之间，左右为难，才华横溢却仕途坎坷。他的诗正是这个没落时代与个人不幸的双重投影。",
  timeline:[
    {period:"约813年",title:"出生",desc:"怀州河内（今河南沁阳）人。出生于没落贵族家庭，幼年丧父，家道艰难。"},
    {period:"早慧",title:"少年才名",desc:"'十六岁著《才论》《圣论》，以古人之文自衬。'受知于令狐楚。"},
    {period:"838年",title:"进士及第",desc:"多年应考后中进士。但入仕后娶李党王茂元之女，卷入党争漩涡：'牛党'视其为叛徒，'李党'视其为敌人。"},
    {period:"仕途坎坷",title:"沉沦下僚",desc:"一生辗转于幕府、州县小官之间，不得志。内心充满抱负难伸的苦闷。"},
    {period:"约858年",title:"病逝",desc:"退居郑州荥阳后病逝，年仅40余岁。他的一生如他诗中所写：'春蚕到死丝方尽，蜡炬成灰泪始干。'"}
  ],
  works:[
    {name:"《锦瑟》",period:"晚年",context:"回望一生，迷茫困惑。'锦瑟无端五十弦'起兴，追忆华年。千百年来'此情可待成追忆，只是当时已惘然'令无数读者动容，其主旨聚讼纷纭。",quote:"此情可待成追忆，只是当时已惘然。"},
    {name:"《无题·相见时难别亦难》",period:"中年",context:"缠绵的爱情誓言与身世飘零的象征交织。'春蚕到死丝方尽，蜡炬成灰泪始干'是流传最广的忠贞写照。",quote:"春蚕到死丝方尽，蜡炬成灰泪始干。"},
    {name:"《登乐游原》",period:"中年",context:"登高望远，感怀身世与国运。'夕阳无限好，只是近黄昏'被后世解读为对大唐衰落的咏叹。",quote:"夕阳无限好，只是近黄昏。"}
  ]},

  {id:"suitang",dynasty:"初唐",name:"李靖",label:"李靖（李卫国）",
  intro:"唐初开国名将，'唐之卫霍'，与徐世勣并为唐代对外征伐的两大柱石。辅佐李渊、李世民开创大唐，南平萧铣、北破东突厥、西定吐谷浑，为大唐奠定辽阔版图，被奉为兵家'卫公'。",
  bg:"隋末群雄并起，天下大乱。唐太宗李世民开疆拓土、威震四海，李靖以其卓越军事才能，南征北战，为唐朝的统一与边疆安定立下赫赫战功，其兵书被后世奉为兵学经典。",
  timeline:[
    {period:"571年",title:"出身",desc:"京兆三原（今陕西三原）人。隋末为官，李渊起兵后召入幕府，从唐破敌。"},
    {period:"620年",title:"南定萧铣",desc:"率军自夔州乘雾溯江，奇袭江陵，一举灭南梁萧铣政权，用兵之奇被叹为'用兵如神'。"},
    {period:"北破东突厥",title:"雪耻定边",desc:"630年与李勣分道北伐东突厥，生擒颉利可汗，'靖！其间雪前朝之耻'，彻底解决了长期威胁北方的突厥边患。"},
    {period:"635年",title:"西定吐谷浑",desc:"率军西征吐谷浑，越积石山，穷追千里，大破其众，安定河西走廊。"},
    {period:"晚年",title:"著兵书",desc:"晚年闭门著《卫公兵法》《六军镜》等兵书，被封卫国公。649年病逝，谥'景武'。"}
  ],
  works:[
    {name:"《卫公兵法》",period:"晚年",context:"唐初最重要的军事著作，传为李靖论兵之旨，包含治军、战术、阵法等丰富内容，惜多有散佚。",quote:"料敌制胜，计险厄远近，上将之道也。"},
    {name:"《李卫公问对》",period:"晚年论兵",context:"（唐太宗与李靖论兵问答录）经后人整理成书，为'武经七书'之一，论及攻守、奇正、虚实诸要，充分体现其军事思想。",quote:"善用兵者，不但知彼知己,亦须知胜之不可强而至，败之不可力求避。"}
  ]},

  {id:"suitang",dynasty:"初唐",name:"魏征",label:"魏征（魏郑公）",
  intro:"唐代著名谏臣，'一代诤臣'。辅佐唐太宗李世民开创'贞观之治'，以直言敢谏著称，前后进谏二百余事，被誉为'人镜'。其谏言多为治理国家的中肯筹策，对贞观盛世的形成起了重要作用。",
  bg:"隋朝暴政速亡，唐太宗吸取教训，与群臣'以古为镜、以人为镜'，励精图治。魏征作为开国之臣，犯颜直谏，为太宗所重，君臣相得，成为千古美谈。",
  timeline:[
    {period:"580年",title:"出身",desc:"巨鹿（今河北邢台）人。少孤贫，胸怀大志，曾为道士。隋末投瓦岗，后归唐。"},
    {period:"隋末",title:"归唐辅政",desc:"先属李密，后入李渊幕府。玄武门之变后，李世民不计前嫌，虚心纳谏，魏征归心太宗，委以重任。"},
    {period:"贞观年间",title:"犯颜直谏",desc:"任谏议大夫，前后谏二百余事。太宗欲纳郑氏女为妃，魏征直谏；太宗欲修宫殿，魏征痛陈隋亡之鉴，太宗皆罢。"},
    {period:"643年",title:"病逝",desc:"病逝后，太宗悲恸：'以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。魏征殁，朕亡一镜矣。'" }
  ],
  works:[
    {name:"《谏太宗十思疏》",period:"贞观年间",context:"力劝太宗居安思危、戒奢以俭、虚心纳下，是魏征最著名的政论，为'贞观之治'提供了治国方略。",quote:"居安思危，戒奢以俭。"},
    {name:"《十渐不克终疏》",period:"贞观十三年",context:"上疏太宗，指出其在十个方面渐失初心，如求治之心渐怠、骄矜之气渐生等，情词恳切，太宗置于案头以自警。",quote:"兼听则明，偏信则暗。"}
  ]},

  {id:"suitang",dynasty:"初唐",name:"薛仁贵",label:"薛仁贵",
  intro:"唐初名将，出身寒微，投军从戎，因功授官至右领军卫将军，封平阳郡公。以勇猛善射、三箭定天山闻名，征高丽、斗吐蕃屡建奇功，是'贫贱出身、从军报国'的励志典范。",
  bg:"唐初武功赫赫，拓土开疆。薛仁贵应募从军，在征东、平西等历次战争中崭露头角，以'三箭定天山''就谷河之战'等战功名震中外，成为传奇式英雄。",
  timeline:[
    {period:"614年",title:"出身寒门",desc:"绛州龙门（今山西河津）人。家贫，务农为生。'寒窑苦读'、勤练武艺，立志建功立业。"},
    {period:"645年",title:"白袍首战",desc:"应募从军，征伐高句丽。在安市城之战中穿白袍冲锋陷阵，连斩敌将，唐太宗赞其为'勇将'。"},
    {period:"662年",title:"三箭定天山",desc:"征讨铁勒九姓，薛仁贵连发三箭射杀三将，敌众溃散，军中歌曰'将军三箭定天山'，威震西域。"},
    {period:"668年",title:"平高句丽",desc:"参与灭高句丽之战，任右威卫大将军兼检校安东都护，安抚辽东。"},
    {period:"大非川",title:"一世英名",desc:"681年于大非川之战兵败，因功过相抵。后复起用，683年病逝，追赠左骁卫大将军。"}
  ],
  works:[
    {name:"平定边患",period:"征战一生",context:"薛仁贵一生征战，从白山黑水到天山戈壁，为唐朝稳定边疆立下不世之功，其'三箭定天山'更是千古流传。",quote:"今日之天山，此三箭之力也！"},
    {name:"从军铭",period:"投军时",context:"薛仁贵以一介寒士立志报国,其'男儿何不带吴钩'的励志精神激励后代无数君子。",quote:"大丈夫应当功名显达,何怍于蓬蒿而不进而自甘。"}
  ]},

  {id:"suitang",dynasty:"盛唐",name:"郭子仪",label:"郭子仪（郭汾阳）",
  intro:"唐代名将、政治家，'再造唐室之功'的社稷重臣。历经玄、肃、代、德四朝，率军平定安史之乱，抵御吐蕃、回纥，收复两京，数度临危受命，累封汾阳王，'中兴再造，功盖天下'。",
  bg:"安史之乱爆发，唐室存亡悬于一线。郭子仪受命于危难，率朔方军东征西讨，收复两京，平定叛乱；后又数度出镇，抵御外患，是唐王朝由衰转危、再造河山的第一功臣。",
  timeline:[
    {period:"697年",title:"出生",desc:"华州郑县（今陕西华县）人。武举出身，善抚士卒。"},
    {period:"755年",title:"临危受命",desc:"安史之乱爆发，郭子仪被任为朔方节度使，率军讨贼，与李光弼并称两帅。"},
    {period:"757年",title:"收复两京",desc:"率军大破叛军，先后收复长安、洛阳，迎回玄宗、肃宗，功勋卓著。"},
    {period:"763年",title:"单骑退兵",desc:"吐蕃与回纥联军攻唐，郭子仪单骑亲赴回纥营，晓以大义，使回纥与唐结盟反击吐蕃，智退重兵。"},
    {period:"783年",title:"封汾阳王",desc:"历任中书令、尚书令，封汾阳郡王，位极人臣而谦恭自守。781年病逝，谥'忠武'，追赠太师。"}
  ],
  works:[
    {name:"《郭汾阳奏议》",period:"历仕四朝",context:"郭子仪历仕玄肃代德四朝，多有奏疏论边防、政事，其忠勤为国、忠恕持身的品格为后世楷模。",quote:"天下安危，系我一身，故当以国事为重。"},
    {name:"忠武风范",period:"再造唐室",context:"郭子仪'功盖一代而主不疑，位极人臣而众不嫉'，安稳度过一生，是古代为臣之道的极致典范。",quote:"平日则待士以宽，临事则驭众以威。"}
  ]},

  // ===== 宋 =====
  {id:"song",dynasty:"北宋",name:"苏轼",label:"苏轼（苏东坡）",
  intro:"号东坡居士，中国文学艺术史上的全才。诗与黄庭坚并称'苏黄'，词开豪放一派，文列'唐宋八大家'，书为'宋四家'之首。一生三度被贬，从黄州到惠州再到儋州，愈挫愈勇，乐观旷达。",
  bg:"北宋中期的'党争'贯穿苏轼一生。先是王安石新党变法，后有司马光旧党执政。苏轼既不盲从新党也不盲从旧党，坚守独立立场，因此两党皆不容。这是他屡遭贬谪的深层原因。",
  timeline:[
    {period:"1037年",title:"生于眉山",desc:"四川眉山人。父苏洵、弟苏辙，合称'三苏'。出生时已家道中落，但家风清正。"},
    {period:"1057年",title:"科考第二名",desc:"与弟苏辙同中进士。欧阳修误以为其文是弟子曾巩之作，为避嫌取为第二。欧阳修叹：'三十年后，无人道老夫也！'"},
    {period:"1071-1079年",title:"外放地方",desc:"因母亲、父亲先后去世，守制后回京。因上书批评新法，被授意弹劾，自请外放。历任杭州通判、密州、徐州知州。"},
    {period:"1079年",title:"乌台诗案",desc:"被打入御史台大牢103天，因诗文被指'讥讽朝政'，几被处死。王安石上书：'安有圣世而杀才士乎？'终被贬黄州。"},
    {period:"1080-1084年",title:"贬居黄州",desc:"精神最低谷，却也是创作巅峰。开垦东坡，自号'东坡居士'。写下《念奴娇》《赤壁赋》《定风波》等千古名篇。"},
    {period:"1085年",title:"短暂高光",desc:"神宗去世高太后摄政，苏轼被召回京，官至翰林学士。因批评旧党全废新法，又遭旧党排挤，自请外放杭州。"},
    {period:"1094年",title:"再贬惠州",desc:"哲宗亲政，新党卷土重来。苏轼被一贬再贬，先是惠州，诗云'日啖荔枝三百颗，不辞长作岭南人'。"},
    {period:"1097年",title:"贬至海南儋州",desc:"流放到当时被视为'海外蛮荒'的海南。却在此办学授徒，开海南文教先河。"},
    {period:"1101年",title:"北归病逝",desc:"徽宗即位大赦，苏轼北归。途经常州染病不治，于常州逝世，享年65岁。"}
  ],
  works:[
    {name:"《念奴娇·赤壁怀古》",period:"1082年贬黄州",context:"在黄州游赤壁（实为赤鼻矶），凭吊周瑜。'大江东去'——豪放词的巅峰之作。以古之英雄反衬自己功业未竟的失意，却又升华到'人生如梦'的旷达。",quote:"大江东去，浪淘尽，千古风流人物。"},
    {name:"《水调歌头·明月几时有》",period:"1076年密州",context:"中秋之夜醉后怀弟苏辙而作。问天问月间超然物外，'此事古难全'道尽人生哲理。被称为中秋词之冠。",quote:"但愿人长久，千里共婵娟。"},
    {name:"《定风波》",period:"1082年贬黄州",context:"沙湖道中遇雨，同行狼狈，独苏轼不觉。以小见大，是他面对人生风雨时'一蓑烟雨任平生'的宣言。",quote:"回首向来萧瑟处，归去，也无风雨也无晴。"},
    {name:"《赤壁赋》",period:"1082年黄州",context:"前赤壁赋以月夜泛舟起笔，借水月之变悟出'物与我皆无尽'的宇宙观，从苦闷走向旷达。中国文学中最美的哲思。",quote:"惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。"},
    {name:"《江城子·乙卯正月二十日夜记梦》",period:"1075年密州",context:"为悼念亡妻王弗而作。十年生死相隔，梦中重逢。铁汉柔情，催人泪下。悼亡词的千古绝唱。",quote:"十年生死两茫茫，不思量，自难忘。"}
  ]},

  {id:"song",dynasty:"北宋",name:"王安石",label:"王安石",
  intro:"北宋改革家、文学家。神宗时任宰相，主持'熙宁变法'，推行青苗、免役、市易等法，志在富国强兵。文学上散文列'唐宋八大家'，诗歌创'王荆公体'，晚年律绝炉火纯青。",
  bg:"北宋中期积贫积弱，'三冗'（冗官冗兵冗费）严重，财政危机深重。王安石目睹时弊，立志改革。他主持的变法是中国历史上最重要的改革之一，也引发了新旧党争的百年震荡。",
  timeline:[
    {period:"1021年",title:"出生",desc:"抚州临川（今江西抚州）人。父王益为地方官，清廉正直。少时随父宦游，亲见民间疾苦。"},
    {period:"1042年",title:"进士第四",desc:"22岁中进士第四名。本应第一，因卷中'孺子其朋'触忌被改为第四。中进士后放弃入馆阁，自愿到地方任职。"},
    {period:"1047-1050年",title:"鄞县知县",desc:"任鄞县知县，兴修水利、贷谷于民（青苗法雏形）、兴办学堂。'鄞县实验'是后来变法的预演，政绩卓著。"},
    {period:"1068年",title:"入京得重用",desc:"神宗即位后，起用王安石为江宁知府，后召为翰林学士。神宗问政，王安石言'变风俗、立法度'。"},
    {period:"1069年",title:"任参知政事",desc:"升任参知政事，设制置三司条例司，全面推行熙宁变法。青苗、免役、市易、均输、方田均税、置将、保甲等新法陆续出台。"},
    {period:"1074年",title:"第一次罢相",desc:"变法触怒保守派，司马光、韩琦、富弼等纷纷反对。大旱时保守派借天象攻击，神宗动摇，王安石第一次罢相知江宁府。"},
    {period:"1075年",title:"复相又罢",desc:"虽被召回相位，但改革团队内部已分裂。爱子王雱病逝，身心俱疲。次年再度罢相，退居金陵一生未回朝。"},
    {period:"1086年",title:"病逝江宁",desc:"哲宗即位，司马光尽废新法。王安石在江宁（南京）钟山半山园病逝，享年65岁。同年九月司马光亦卒。"}
  ],
  works:[
    {name:"《答司马谏议书》",period:"变法期间（1069年）",context:"司马光写信三封反对变法，王安石作此答复。逐条反驳，义正词严。'度义而后动，是而不见其可悔也'——改革者的坚定与自信。",quote:"如曰今日当一切不事事，守前所为而已，则非某之所敢知。"},
    {name:"《游褒禅山记》",period:"1054年",context:"借游山而明志：'尽吾志也而不能至者，可以无悔矣。'以登山喻治学与改革，勉励尽志而为之。",quote:"尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？"},
    {name:"《泊船瓜洲》",period:"复相赴京途中",context:"二次起复为相，泊船瓜洲渡口。'春风又绿江南岸'——一个'绿'字改了几十次，成为中国炼字的名典。但'明月何时照我还'又流露出对政治的倦怠。",quote:"春风又绿江南岸，明月何时照我还。"},
    {name:"《梅花》",period:"晚年退居",context:"退居金陵半山园，以梅花自喻。'墙角数枝梅，凌寒独自开'——孤高自守，不与世争。",quote:"遥知不是雪，为有暗香来。"}
  ]},

  {id:"song",dynasty:"两宋之交",name:"李清照",label:"李清照",
  intro:"'千古第一才女'，婉约词派代表。出身书香门第，与赵明诚琴瑟和鸣。前期词风清新婉丽，写闺中生活与夫妻情趣；南渡后词风凄苦沉郁，家国之痛入骨。提出'词别是一家'的理论。",
  bg:"李清照的一生以靖康之变（1127年）为分水岭。前期是北宋末年的繁华与家庭幸福；后期遭遇国破家亡、丈夫早逝、文物散尽。她的变化正是整个民族命运变化的缩影。",
  timeline:[
    {period:"1084年",title:"出生于济南",desc:"山东章丘人。父李格非为苏轼弟子，母为状元王拱辰孙女，书香门第。'自少年即有诗名'。"},
    {period:"1101年",title:"嫁赵明诚",desc:"18岁嫁太学生赵明诚。夫妻志趣相投，共同收集金石书画，著《金石录》。'赌书泼茶'的雅趣传为佳话。"},
    {period:"前期",title:"清新婉约",desc:"前期词多写闺中生活、离愁别绪。《如梦令》'知否，知否？应是绿肥红瘦'等婉转明丽。"},
    {period:"1127年",title:"靖康之变",desc:"金兵南侵，北宋灭亡。李清照携金石文物南渡，途中文物大量散失。"},
    {period:"1129年",title:"丧夫",desc:"赵明诚于建康病逝。李清照悲痛欲绝，作《声声慢》：'寻寻觅觅，冷冷清清，凄凄惨惨戚戚。'"},
    {period:"晚年",title:"孤苦漂泊",desc:"漂泊江南，晚景孤苦无依。虽再嫁张汝舟但旋即离异，饱受世人非议。约1155年病逝。"}
  ],
  works:[
    {name:"《如梦令·昨夜雨疏风骤》",period:"少女时期",context:"春夜醉酒，晨起见海棠凋零。'绿肥红瘦'道尽其惜花惜春之心。少女才情，清新灵动。",quote:"知否，知否？应是绿肥红瘦。"},
    {name:"《一剪梅》",period:"婚后离别",context:"与赵明诚分别，缱绻深情。'此情无计可消除，才下眉头，却上心头'——道尽相思。",quote:"花自飘零水自流。一种相思，两处闲愁。"},
    {name:"《声声慢》",period:"丧夫后（1129年）",context:"以叠字起笔，连用十四叠字。国破家亡、丧偶之痛尽在其中。是李清照词风由婉丽转向凄苦的标志。",quote:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。这次第，怎一个愁字了得！"},
    {name:"《夏日绝句》",period:"南渡后",context:"'生当作人杰，死亦为鬼雄'——借项羽自刎，讽刺南宋统治者苟安江南。一个弱女子的家国大义。",quote:"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。"}
  ]},

  {id:"song",dynasty:"南宋",name:"辛弃疾",label:"辛弃疾",
  intro:"豪放派词人代表，兼为军事家、政治家。青年时率五十骑突入金营生擒叛将。一生力主北伐收复中原，然'却将万字平戎策，换得东家种树书'，壮志难酬。词风雄浑豪放，与苏轼并称'苏辛'。",
  bg:"南宋初年，金兵占领中原，半壁江山沦陷。主战与主和两派斗争激烈。辛弃疾生长于沦陷区，志在收复故土，却长期被朝廷猜忌，数次起用又数次罢免。他的词是'英雄失路'的悲歌。",
  timeline:[
    {period:"1140年",title:"生于沦陷区",desc:"山东历城（今济南）人。生于金人统治下的沦陷区，祖父以'大宗国'寄志，常带其'登高望远，指点河山'。"},
    {period:"1161年",title:"起义抗金",desc:"金主完颜亮南侵时，辛弃疾聚众两千余人起兵抗金，加入耿京起义军。"},
    {period:"1162年",title:"生擒张安国",desc:"叛徒张安国杀耿京降金。辛弃疾率五十骑突袭五万金兵营地，生擒张安国，押回临安正法。一时名震朝野。"},
    {period:"南归后",title:"献《美芹十论》",desc:"南归宋朝，向孝宗献《美芹十论》《九议》，详陈抗金方略。然朝廷主和派当权，其策未被采纳。"},
    {period:"官场浮沉",title:"主战被贬",desc:"历任湖北、江西、福建等路安抚使等职，因坚持抗金主张，屡遭弹劾罢免。'把吴钩看了，栏杆拍遍，无人会、登临意。'"},
    {period:"晚年",title:"闲居铅山",desc:"长期闲居上饶铅山带湖、瓢泉。虽归隐田园，但至死不渝收复之志。1207年病逝，临终大呼'杀贼！杀贼！'"}
  ],
  works:[
    {name:"《永遇乐·京口北固亭怀古》",period:"1205年镇江",context:"晚年出任镇江知府，登北固亭北望——那里本是他的故乡山东。追怀孙权、刘裕，渴望再启北伐，又忧虑主政者轻敌冒进。是中国词中怀古的巅峰。",quote:"凭谁问：廉颇老矣，尚能饭否？"},
    {name:"《破阵子·为陈同甫赋壮词以寄》",period:"闲居时期",context:"'醉里挑灯看剑，梦回吹角连营'——梦中杀敌，醒来'可怜白发生'。一生征战梦想与壮志难酬的强烈反差。",quote:"了却君王天下事，赢得生前身后名。可怜白发生！"},
    {name:"《青玉案·元夕》",period:"闲居时期",context:"元宵灯火中寻觅佳人，'蓦然回首，那人却在灯火阑珊处'。王国维以此喻'古今成大事业、大学问者'之第三境界。",quote:"蓦然回首，那人却在，灯火阑珊处。"},
    {name:"《水龙吟·登建康赏心亭》",period:"南归初期",context:"登建康赏心亭北望，'落日楼头，断鸿声里，江南游子。'自被孤立。报国无门之悲，最是辛词本色。",quote:"倩何人唤取，红巾翠袖，揾英雄泪。"}
  ]},

  {id:"song",dynasty:"南宋",name:"岳飞",label:"岳飞（岳武穆）",
  intro:"南宋抗金名将、军事家、民族英雄。治军之严、用兵之明冠绝南宋，'岳家军'令金人叹'撼山易，撼岳家军难'。力主北伐收复失地，终因'莫须有'罪名冤死于风波亭。",
  bg:"南宋初年，金兵屡次南侵，山河破碎。国家危难之际，主战与主和两派激烈交锋。宋高宗与秦桧一心求和，岳飞立志'直捣黄龙，迎回二圣'，成为主战派的旗帜。",
  timeline:[
    {period:"1103年",title:"出身",desc:"相州汤阴（今河南汤阴）人。少时家贫力学，先后从周侗、陈广习武学射，左右开弓、生有神力。"},
    {period:"北宋末年",title:"初投军旅",desc:"1122年从军抗辽。靖康之变后，率部转战抗金，屡建奇功。"},
    {period:"建炎年间",title:"收复失地",desc:"厉兵秣马，组建'岳家军'。军纪严明，'冻死不拆屋，饿死不掳掠'，深受百姓爱戴。"},
    {period:"1140年",title:"郾城大捷",desc:"郾城、颍昌之战大破金兀术铁浮屠、拐子马，进军朱仙镇，距离汴京仅四十五里，直欲'直捣黄龙'。"},
    {period:"1142年",title:"含冤而死",desc:"宋高宗一日十二道金牌班师，岳飞被捕，以'莫须有'罪名被害于临安风波亭，年仅39岁。二十年后平反昭雪，追谥武穆。"}
  ],
  works:[
    {name:"《满江红》",period:"北伐前后",context:"'怒发冲冠'而作，慷慨悲壮，是他的爱国情怀与壮志未酬之情的高度浓缩。公认的爱国词雄篇。",quote:"壮志饥餐胡虏肉，笑谈渴饮匈奴血。莫等闲、白了少年头，空悲切！"},
    {name:"《小重山》",period:"南渡后",context:"'昨夜寒蛩不住鸣'——直白地写尽了他'欲将心事付瑶琴，知音少，弦断有谁听'的孤愤与无奈。",quote:"欲将心事付瑶琴，知音少，弦断有谁听？"},
    {name:"《乞出师札子》",period:"北伐前",context:"任太尉时向朝廷奏请出师北伐的奏折，体现其务实精细的军事思想。",quote:"还我河山。"}
  ]},

  {id:"song",dynasty:"北宋",name:"包拯",label:"包拯（包青天）",
  intro:"北宋名臣，以清廉刚直、铁面无私著称，被誉为'包青天'。屡断奇案、弹劾权贵，百姓呼为'包待制''包龙图'，是中国历史上清官的象征。",
  bg:"北宋初期政治日渐因循，官僚机构臃肿，贪腐滋生。真宗、仁宗朝积弊渐显，朝廷急需刚正不阿之臣振肃纲纪。包拯正是在这样的背景下，以忠直敢言闪耀朝堂。",
  timeline:[
    {period:"999年",title:"出生",desc:"庐州合肥（今安徽合肥）人。28岁中进士，因父母年老，辞官在家奉养十年，成为孝道典范。"},
    {period:"1037年",title:"出仕",desc:"父母亡故后入仕，初任天长知县，后历任端州、扬州等地，惩恶扬善，声名渐著。"},
    {period:"嘉祐年间",title:"权知开封府",desc:"任开封府尹，执法不避权贵，'关节不到，有阎罗包老'。皇亲国戚、豪强巨室闻之丧胆。"},
    {period:"晚年",title:"枢密副使",desc:"官至枢密副使、龙图阁直学士。卒后谥'孝肃'，世人尊称'包孝肃''包公'。"}
  ],
  works:[
    {name:"《包孝肃奏议》",period:"从政时期",context:"辑其奏章上疏而成，多论时政得失、劾奸进贤，是研究其政治思想与北宋朝政的第一手资料。",quote:"清心为治本，直道是身谋。"},
    {name:"家训",period:"晚年",context:"立家训告诫子孙，'后世子孙仕宦，有犯赃滥者，不得放归本家；死不得葬大茔中'，可见其清廉持家。",quote:"后世子孙仕宦有犯赃者，不得放归本家；死不得葬大茔中，不从吾志，非吾子孙。"}
  ]},

  {id:"song",dynasty:"北宋",name:"范仲淹",label:"范仲淹",
  intro:"北宋杰出的政治家、军事家、文学家。主持'庆历新政'，戍边西夏奠定西北防线。'先天下之忧而忧，后天下之乐而乐'千古传诵，是'胸有万卷书，志在天下事'的士大夫典范。",
  bg:"宋仁宗朝积贫积弱，内忧外患。西北西夏连年犯边，朝政弊端丛生。范仲淹以'先忧后乐'之志锐意改革，虽新政受挫，但其精神影响了整个宋代士风。",
  timeline:[
    {period:"989年",title:"出身寒门",desc:"苏州吴县（今江苏苏州）人。两岁丧父，母改嫁朱氏，'划粥断齑'、'断齑画粥'发愤苦读，终成大器。"},
    {period:"1015年",title:"进士及第",desc:"中进士，官至副宰相。为官清正廉明，直言进谏。"},
    {period:"1040年",title:"戍守西北",desc:"任陕西四路经略安抚使，抗击西夏李元昊。修筑城寨、充实军备，西夏自此不敢轻易犯边，边人歌曰'军中有一范，西贼闻之惊破胆'。"},
    {period:"1043年",title:"庆历新政",desc:"上《十事疏》，主持庆历新政，整顿吏治、改革科举。因守旧派反对，仅一年余即失败，范仲淹被贬。"},
    {period:"1046年",title:"贬谪邓州",desc:"被贬至邓州，应好友所托写下《岳阳楼记》，'不以物喜，不以己悲'，成为千古名篇。1052年病逝于徐州。"}
  ],
  works:[
    {name:"《岳阳楼记》",period:"1046年邓州",context:"借重修岳阳楼之机，抒写自己'先忧后乐'的政治抱负与人生境界，理想主义者的人格宣言。",quote:"先天下之忧而忧，后天下之乐而乐。"},
    {name:"《渔家傲·秋思》",period:"戍边时期",context:"写戍守西北时的苍凉心境，'浊酒一杯家万里'，边塞词的先声。",quote:"人不寐，将军白发征夫泪。"},
    {name:"《苏幕遮·怀旧》",period:"边塞怀乡",context:"'碧云天，黄叶地'，写羁旅思乡之情，开婉约词境。",quote:"明月楼高休独倚，酒入愁肠，化作相思泪。"}
  ]},

  {id:"song",dynasty:"北宋",name:"欧阳修",label:"欧阳修（欧阳文忠）",
  intro:"北宋政治家、文学家、史学家，'唐宋八大家'之一。既是政坛重臣，又是文坛领袖，领导北宋诗文革新运动，与韩愈、柳宗元、苏轼、王安石并称'唐宋八大家'。三苏、曾巩、王安石皆出其门下。",
  bg:"宋代承唐末五代之弊，文风浮艳、骈俪成风。欧阳修力倡'文以载道、平实自然'，扭转了一代文风。同时身处庆历、嘉祐之朝，积极参与政治改革。",
  timeline:[
    {period:"1007年",title:"出生",desc:"庐陵（今江西吉安）人。号醉翁、六一居士。四岁丧父，家境贫寒，'以荻画地'苦学。"},
    {period:"1030年",title:"科举入仕",desc:"中进士甲科。历任馆阁校勘、谏官等。支持范仲淹庆历新政，因此被贬夷陵、滁州等地。"},
    {period:"滁州时期",title:"与民同乐",desc:"任滁州太守，写《醉翁亭记》，'醉翁之意不在酒，在乎山水之间也'，与民同乐的人生态度。"},
    {period:"嘉祐年间",title:"京兆文宗",desc:"任参知政事，主盟文坛，提携苏轼等晚辈，形成鼎盛的'嘉祐文坛'。"},
    {period:"晚年",title:"归隐闲适",desc:"晚年自号'六一居士'，退居颍州，整理书籍，1072年病逝，追谥'文忠'。"}
  ],
  works:[
    {name:"《醉翁亭记》",period:"1045年滁州",context:"以'醉翁之意不在酒'写寄情山水、与民同乐的放达豁达。文中连用'也'字句式，开散文一脉新境界。",quote:"醉翁之意不在酒，在乎山水之间也。"},
    {name:"《卖油翁》",period:"晚年",context:"借卖油翁'我亦无他，唯手熟尔'之语，阐释熟能生巧、谦逊反复的哲理。",quote:"我亦无他，惟手熟尔。"},
    {name:"《朋党论》",period:"景祐年间",context:"针对庆历新政而作，辩'君子与小人'之别，论证君子之有党、小人之无党，是政治散文的杰作。",quote:"君子与君子以同道为朋，小人与小人以同利为朋。"},
    {name:"《生查子·元夕》",period:"早年",context:"'月上柳梢头，人约黄昏后'，香艳清丽，是宋词中早期的名篇。",quote:"月上柳梢头，人约黄昏后。"}
  ]},

  {id:"song",dynasty:"南宋",name:"陆游",label:"陆游（陆放翁）",
  intro:"南宋伟大的爱国主义诗人，'中兴四大诗人'之首。一生创作诗歌近万首，是中国古代存诗最多的诗人。爱国之情贯穿一生，'位卑未敢忘忧国'直至八十五岁临终仍是'家祭无忘告乃翁'的悲壮遗言。",
  bg:"南宋偏安半壁，金人虎视眈眈，主战主和争论不休。陆游生于国破家亡之际，毕生渴望'王师北定中原日'，却一生郁郁不得志，只能在诗中倾泻忧国忧民之情。",
  timeline:[
    {period:"1125年",title:"出生",desc:"越州山阴（今浙江绍兴）人。出生于淮水舟中，正值金兵南下的乱世。"},
    {period:"早年",title:"科举受挫",desc:"因主张抗金、反对秦桧，科举屡遭黜落。秦桧死后才得以入仕。"},
    {period:"南郑从军",title:"投身抗金",desc:"中年曾在南郑前线从军，亲历军旅生活，坚定了抗金报国信念。但壮志难酬，频繁遭排挤。"},
    {period:"晚年",title:"闲居山阴",desc:"晚年多居家乡山阴'老学庵'，种花读书，写诗成癖，饱含幽愤与孤怀。"},
    {period:"1210年",title:"临终遗恨",desc:"八十五岁病逝，临终前作《示儿》：'王师北定中原日，家祭无忘告乃翁。'" }
  ],
  works:[
    {name:"《示儿》",period:"1210年临终",context:"绝笔诗。一生抗金之志至死不改，把收复中原的遗愿托付给下一代，悲壮感人。",quote:"王师北定中原日，家祭无忘告乃翁。"},
    {name:"《书愤》",period:"1186年",context:"'早岁那知世事艰'，回顾抗金壮志与现实的落差，抒发老骥伏枥之志与壮志难酬之悲。",quote:"塞上长城空自许，镜中衰鬓已先斑。"},
    {name:"《游山西村》",period:"闲居山阴",context:"写山村田园风光与淳朴民情，'山重水复疑无路，柳暗花明又一村'暗喻人生境地之变换。",quote:"山重水复疑无路，柳暗花明又一村。"},
    {name:"《临安春雨初霁》",period:"81岁首",context:"'小楼一夜听春雨，深巷明朝卖杏花'——闲适中寓孤愤，平淡中见深沉，是陆游晚年名作。",quote:"小楼一夜听春雨，深巷明朝卖杏花。"}
  ]},

  // ===== 元 =====
  {id:"yuan",dynasty:"元",name:"关汉卿",label:"关汉卿",
  intro:"元代杂剧奠基人，'元曲四大家'之首。一生创作杂剧六十余种，现存十八种。作品深刻揭露社会黑暗，歌颂反抗精神，语言本色当行。被后世尊为'中国的莎士比亚'。",
  bg:"元朝统治者轻视汉人，废除科举近八十年，大批文人沦落民间。而发达的市井经济为杂剧提供了舞台。关汉卿正是'书会才人'的代表，把毕生才华奉献给了这一新兴艺术。",
  timeline:[
    {period:"约1230年",title:"大约出生于金末",desc:"大都（今北京）人。一说生于解州（今山西运城）。据明人记载，钟嗣成《录鬼簿》称其为'大都人'。"},
    {period:"金元易代",title:"亡国之痛",desc:"金亡于蒙古，亲历朝代更迭之乱。这对他的创作产生了深远影响。"},
    {period:"中年",title:"混迹书会",desc:"生活在'书会'（编剧行会）中，自嘲'我是个蒸不烂、煮不熟、捶不扁、炒不爆、响珰珰一粒铜豌豆'。"},
    {period:"创作高峰",title:"杂剧创作",desc:"创作大量杂剧，题材广泛：公案戏《窦娥冤》、爱情戏《救风尘》、历史戏《单刀会》等。"},
    {period:"晚年",title:"南游杭州",desc:"晚年南游杭州，与杨显之等剧作家交游。约1300年前后去世。"}
  ],
  works:[
    {name:"《窦娥冤》",period:"创作高峰",context:"写窦娥被冤杀的故事，血溅白绫、六月飞雪、大旱三年三愿尽验。是公案戏与悲剧的巅峰，中国古典悲剧的代表。",quote:"地也，你不分好歹何为地！天也，你错勘贤愚枉做天！"},
    {name:"《救风尘》",period:"创作高峰",context:"写妓女赵盼儿机智斗恶，救出被欺的结拜姐妹。歌颂下层女性的智慧与侠义。是关汉卿喜剧中的代表作。",quote:"不是我说大话，则我这包残胆，救出一个红粉知己。"},
    {name:"《单刀会》",period:"创作高峰",context:"写关羽单刀赴会。'大江东去浪千叠'——借关羽之口，抒发民族情怀与英雄气概。",quote:"大江东去浪千叠，引着这数十人驾着这小舟一叶。"}
  ]},

  {id:"yuan",dynasty:"元",name:"马致远",label:"马致远",
  intro:"'元曲四大家'之一，号东篱。散曲成就最高，被誉为'曲状元'。一生宜闲恬淡，晚年隐居山林。杂剧、散曲俱佳，风格豪放中兼有清丽。代表作《天净沙·秋思》被誉为'秋思之祖'。",
  bg:"元朝科举废除，读书人地位一落千丈，'九儒十丐'之说盛行。马致远早年曾有仕进之志，但不得志，晚年转向山林与诗酒。他代表了元代文人从人世到出世的典型轨迹。",
  timeline:[
    {period:"约1250年",title:"出生",desc:"大都（今北京）人。号东篱，取陶渊明'采菊东篱下'之意。"},
    {period:"中年",title:"入仕无门",desc:"曾做过江浙行省务官等小官（主管赋税杂务的品官），颇不得志。"},
    {period:"晚年",title:"隐居田园",desc:"看破官场，退隐山林。寄情诗酒山水，与卢挚、王伯成等人唱和。"},
    {period:"1321年后",title:"去世",desc:"约在1321年前后去世。其散曲集名《东篱乐府》。"}
  ],
  works:[
    {name:"《天净沙·秋思》",period:"隐居时期",context:"全篇二十八字，九组意象叠加，勾勒出一幅羁旅秋景。'断肠人在天涯'——元代文人在乱世中漂泊无依的心境写照。被元人周德清誉为'秋思之祖'。",quote:"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人在天涯。"},
    {name:"《汉宫秋》",period:"晚年",context:"写昭君出塞。借王昭君之悲剧，抒亟欲抒发的故国之思与民族悲愤，是元杂剧四大悲剧之一。",quote:"呀，俺向着这迥野悲凉，草已添黄，兔早迎霜。"}
  ]},

  {id:"yuan",dynasty:"元",name:"成吉思汗",label:"孛儿只斤·铁木真",
  intro:"蒙古帝国奠基者，世界历史上最伟大的军事统帅之一。统一蒙古各部，称'成吉思汗'（意为'拥有四海的可汗'），建立幅员空前的蒙古帝国。其军事征服震撼欧亚，深刻影响了世界历史进程。",
  bg:"12世纪末，蒙古草原部落林立、战乱不休，金朝统治暴虐。铁木真历经坎坷，先后击败塔塔儿、克烈、乃蛮诸部，统一草原，建立蒙古汗国，进而发动西征，震动欧亚。",
  timeline:[
    {period:"1162年",title:"出生",desc:"蒙古乞颜部人。父亲也速该被塔塔儿人毒死，少年铁木真与家人颠沛流离，饱经磨难。"},
    {period:"1180年代",title:"起兵复仇",desc:"屈身于王罕、札木合麾下，卧薪尝胆，逐步聚拢部众，崛起于草原。"},
    {period:"1206年",title:"统一蒙古",desc:"大会于斡难河源，即大汗位，尊号'成吉思汗'。建制立法，创立蒙古文字，建号'大蒙古国'。"},
    {period:"1219年",title:"西征花剌子模",desc:"发动第一次西征，横扫中亚，摧毁花剌子模帝国，铁骑所至，威震欧亚。"},
    {period:"1227年",title:"病逝",desc:"攻打西夏途中病逝于六盘山。葬地成谜，遗命诸子共尊窝阔台。其孙忽必烈建元，追尊太祖。"}
  ],
  works:[
    {name:"大札撒法典",period:"统一蒙古后",context:"成吉思汗颁布的蒙古第一部成文法，以法典巩固统治，官制、法制由此而兴。",quote:"比利是我律令的根基，我的智慧是它的准绳。"},
    {name:"《成吉思汗箴言》",period:"帝国初建",context:"后世辑录其训言，多论治国、用人、征战之道，是研究其政治与军事思想的重要文献。",quote:"治国者须先治其心，牧民者须先得民之心。"}
  ]},

  // ===== 明 =====
  {id:"ming",dynasty:"元末明初",name:"罗贯中",label:"罗贯中",
  intro:"中国古典长篇小说巨匠，《三国演义》作者。号湖海散人，相传为施耐庵学生。其历史演义小说奠定了中国古代章回体长篇小说的基本格局。",
  bg:"元末明初社会动荡，'一时多少豪杰'。朱元璋削平群雄、建立大明。罗贯中曾参与张士诚起义，怀有政治抱负。后归隐著书，以历史演义寄托其英雄情怀与治国理想。",
  timeline:[
    {period:"约1330年",title:"出生于太原",desc:"一说钱塘（今杭州）人，一说山西太原人。号湖海散人。生活于元末明初。"},
    {period:"元末",title:"流离与幕僚",desc:"天下板荡，罗贯中有志济世，相传曾投身张士诚幕府，献计谋而未遂。后避乱隐居。"},
    {period:"明初",title:"专心著书",desc:"明洪武年间归隐，专心从事小说创作。相传为施耐庵门人，二人合作整理《水浒传》。"},
    {period:"约1400年",title:"去世",desc:"约在元末明初之际去世。其创作除《三国演义》外，还有《隋唐志传》《残唐五代史演义》《三遂平妖传》等。"}
  ],
  works:[
    {name:"《三国演义》",period:"明初",context:"中国第一部长篇章回体历史演义小说。取材东汉末至晋统一的历史。七分实事，三分虚构。塑造了曹操、诸葛亮、关羽等不朽形象。开篇词（杨慎作）'滚滚长江东逝水'道尽了历史兴亡。",quote:"滚滚长江东逝水，浪花淘尽英雄。是非成败转头空。青山依旧在，几度夕阳红。"}
  ]},

  {id:"ming",dynasty:"明",name:"王守仁",label:"王阳明",
  intro:"明代心学集大成者，军事家、思想家、教育家。号阳明子，世称'阳明先生'。历仕弘治、正德、嘉靖三朝，平定宁王叛乱，以文臣封伯爵。龙场悟道，提出'致良知''知行合一'。其学说远播日本、朝鲜。",
  bg:"明代中后期政治黑暗，宦官专权、廷杖盛行、士风颓唐。王阳明贬谪龙场后在极端困顿中悟出'心即理'，以心学为乱世迷途者立起精神支柱。他的'心学'是中国思想史上的一次革命。",
  timeline:[
    {period:"1472年",title:"出生于余姚",desc:"浙江余姚人。父王华为成化十七年状元，官至南京吏部尚书。"},
    {period:"少年",title:"'格竹'之惑",desc:"青年时期笃信朱熹'格物致知'，对庭前竹子'格'了七日，劳思致疾而无所得。对'向外求理'产生怀疑。"},
    {period:"1506年",title:"得罪刘瑾",desc:"武宗时宦官刘瑾专权，王守仁上疏弹劾，触怒刘瑾，被廷杖四十，贬为贵州龙场驿丞。"},
    {period:"1508年",title:"龙场悟道",desc:"贬居龙场（今贵州修文）的绝境中，日夜静思。忽大悟'格物致知之旨'，'吾性自足，不假外求'，史称'龙场悟道'。这是王阳明心学的诞生。"},
    {period:"1519年",title:"平定宁王",desc:"宁王朱宸濠在南昌起兵叛乱。时任南赣巡抚的王守仁临危受命，只用四十余日便生擒宁王。以文臣封新建伯。"},
    {period:"1522年后",title:"讲学传道",desc:"晚年聚众讲学，'知行合一''致良知'之说风靡天下。从学者云集，门生遍布。"},
    {period:"1529年",title:"病逝",desc:"总督两广军务时，肺病加重，上疏请归。病逝于归途中（江西大庾）。临终遗言：'此心光明，亦复何言。'"}
  ],
  works:[
    {name:"《传习录》",period:"讲学时期",context:"记录其与门人论学的语录，是心学最重要的典籍。'知是行之始，行是知之成'——知行合一的核心论述。",quote:"你未看此花时，此花与汝心同归于寂。你来看此花时，则此花颜色一时明白起来。"},
    {name:"《大学问》",period:"晚年",context:"对《大学》宗旨的心学阐释，系统展开'致良知'学说。是其思想的纲领性著作。",quote:"致吾心之良知于事物者，是谓知行合一。"}
  ]},

  {id:"ming",dynasty:"明",name:"郑和",label:"郑和（三宝太监）",
  intro:"明代航海家、外交家。奉明成祖之命七下西洋，历时28年，遍访亚非30余国，最远抵达非洲东海岸和红海沿岸。是人类航海史上空前壮举，比欧洲航海家哥伦布早半个多世纪。",
  bg:"明成祖朱棣迁都北京后，为宣扬国威、开拓海路、联络海外诸邦，决定开展大规模航海活动。郑和作为穆斯林出身的宦官，深谙航海与外交，遂担此重任。此前的海洋主要是阿拉伯人与印度人的世界。",
  timeline:[
    {period:"1371年",title:"出生",desc:"原姓马，名和，云南昆阳人，回族。出身于穆斯林世家，父祖皆朝圣者。"},
    {period:"少年",title:"入宫",desc:"明初被掳入宫为宦，因在靖难之役中立功，赐姓'郑'，名郑和。后人称'三宝太监'（三宝者，佛、法、僧也）。"},
    {period:"1405年",title:"首下西洋",desc:"永乐三年起，率船队两万七千余人、百余艘宝船，从南京出发，首航西洋。"},
    {period:"1405-1433年",title:"七下西洋",desc:"历时28年，七次远航，最远到达非洲索马里、肯尼亚一带。船队规模与航海技术领先世界。"},
    {period:"1433年",title:"病逝于归途",desc:"最后一次远航归途，病逝于印度古里。葬于南京牛首山。"}
  ],
  works:[
    {name:"《郑和航海图》",period:"七下西洋时期",context:"随郑和远航的航海家整理的航线图，绘有亚非沿岸数百个地名，是中国古代最重要的航海文献。",quote:"巨舰虽大，观海犹傲，然天下海疆,皇命之威服于四夷。"},
    {name:"航海壮举",period:"下西洋",context:"郑和下西洋不仅是航海探险，更开创了东西方海上交通与经济文化交流的先河，是一次意义深远的外交与贸易行动。",quote:"宣教化于海外诸番国，导以礼义，变其夷习。"}
  ]},

  {id:"ming",dynasty:"明",name:"戚继光",label:"戚继光",
  intro:"明代抗倭名将、军事家。组建'戚家军'，首创鸳鸯阵，横扫东南倭患，又北御蒙古。一生百战不殆，治军严明，论兵著书，是继韩信、李靖之后的又一位功勋卓著的民族英雄。",
  bg:"明中叶，倭寇（日本海盗集团）祸乱东南沿海，烧杀掳掠，民不聊生。朝廷官军腐败无能。戚继光训练新军，转战浙闽粤沿海，终平倭患，护国佑民。",
  timeline:[
    {period:"1528年",title:"出身将门",desc:"山东蓬莱人，祖籍南直隶。出身军将世家，十七岁袭登州卫指挥佥事。"},
    {period:"1555年",title:"浙江抗倭",desc:"调任浙江，招募义乌农民矿工，组建'戚家军'，纪律严明，战无不胜。"},
    {period:"1561年",title:"台州大捷",desc:"台州九战九捷，首创'鸳鸯阵'（长短兵器结合的阵法），大破倭寇。"},
    {period:"1565年",title:"平定倭患",desc:"与福建俞大猷、广东等部配合，彻底扫平东南倭寇。"},
    {period:"晚年",title:"北御鞑靼",desc:"调任蓟镇总兵，修缮长城、训练边军十六年，北方安宁。'封侯非我意，但愿海波平'。"}
  ],
  works:[
    {name:"《纪效新书》",period:"浙江抗倭时",context:"总结抗倭练兵作战经验的兵书，论练兵、练将、阵法，是中国古代重要的军事著作。",quote:"兵之胜败，不在众寡，在吾能与士卒同心。"},
    {name:"《练兵实纪》",period:"蓟镇练兵时",context:"继任蓟镇后总结北方边防练兵经验的兵书，结合车步骑营阵，强调训练与实战。",quote:"将士所以杀身成仁，舍生取义者，皆出于此。"}
  ]},

  {id:"ming",dynasty:"明",name:"于谦",label:"于谦",
  intro:"明代民族英雄、政治家。土木之变后临危受命，力挽狂澜，组织北京保卫战击退瓦剌，救护国于危难。后因功高遭忌，被英宗冤杀。诗'粉身碎骨浑不怕，要留清白在人间'正是其人品格。",
  bg:"明英宗在'土木堡之变'中被瓦剌俘虏，大军覆灭，京师大震。主迁都逃跑之声四起。时任兵部侍郎的于谦力主坚守北京，拥立景泰帝，组织保卫战大败瓦剌，使大明转危为安。",
  timeline:[
    {period:"1398年",title:"出生",desc:"浙江钱塘（今杭州）人，少有大志，七岁即能咏诗，'粉身碎骨浑不怕，要留清白在人间'为其少年作。"},
    {period:"永乐年间",title:"入仕为官",desc:"中进士，历任监察御史、巡抚，为官清正，体恤民情，平反冤狱。"},
    {period:"1449年",title:"北京保卫战",desc:"土木堡之变后，力排众议主导京师防御，拥戴景帝即位，亲自督战九门，大破瓦剌大军，迎回英宗。"},
    {period:"1457年",title:"冤死",desc:"英宗复辟发动'夺门之变'，于谦以'意欲'之罪被诬杀。成化年间平反，追谥'忠肃'。"}
  ],
  works:[
    {name:"《石灰吟》",period:"少年",context:"借咏石灰言志：'千锤万凿出深山，烈火焚烧若等闲。'以清白自许，是其一生操守的写照。",quote:"粉身碎骨浑不怕，要留清白在人间。"},
    {name:"《观书》",period:"中年",context:"'书卷多情似故人，晨昏忧乐每相亲'——写读书之乐，体现其好学不倦。",quote:"眼前直下三千字，胸次全无一点尘。"}
  ]},

  // ===== 清 =====
  {id:"qing",dynasty:"清",name:"曹雪芹",label:"曹雪芹",
  intro:"中国古典文学巅峰之作《红楼梦》的作者，伟大的现实主义作家。出身江宁织造世家，家道中落后贫居北京西郊。'披阅十载、增删五次'，以血泪著成《红楼梦》。",
  bg:"清代康熙、雍正年间文字狱酷烈，官僚权贵盛极而衰。曹雪芹家世赫赫而一朝衰败，亲历'忽喇喇似大厦倾'的巨变。他把对大贵族生活、对人生无常的深刻体察写入了《红楼梦》。",
  timeline:[
    {period:"约1715年",title:"出生",desc:"一说生于南京。祖父曹寅曾任江宁织造，极受康熙宠信。康熙六次南巡，四次以曹家为行宫。"},
    {period:"少年",title:"锦衣纨绔",desc:"少年时期过着'锦衣纨袴、饫甘餍肥'的贵族生活，'自爱秦淮风月佳'。"},
    {period:"雍正朝",title:"家道衰落",desc:"雍正年间曹家被抄家，家族败落。曹雪芹少年时即遭巨变，从锦绣膏粱跌入困顿。"},
    {period:"中年",title:"贫居西郊",desc:"移居北京西郊，贫困潦倒，'举家食粥酒常赊'。靠卖画维持生计。"},
    {period:"晚年",title:"著书《红楼梦》",desc:"痛感家世兴衰与人生无常，'披阅十载，增删五次'，创作《红楼梦》。'字字看来皆是血，十年辛苦不寻常。'"},
    {period:"约1763年",title:"病逝",desc:"幼子夭亡后，曹雪芹伤心过度，一病不起，于除夕病逝于北京。终年约48岁。《红楼梦》仅传前八十回，后四十回为高鹗所续。"}
  ],
  works:[
    {name:"《红楼梦》",period:"晚年",context:"中国古典小说的巅峰。以贾、史、王、薛四大家族为背景，以宝黛爱情为主线，深刻揭示了封建社会走向衰亡的历史必然。'字字看来皆是血，十年辛苦不寻常'。",quote:"满纸荒唐言，一把辛酸泪。都云作者痴，谁解其中味。"}

  {id:"qing",dynasty:"清",name:"郑成功",label:"郑成功（国姓爷）",
  intro:"明末清初民族英雄。坚持抗清，收复台湾，驱逐荷兰殖民者，使台湾重归中华版图。被尊为'开台圣王'，是反抗外来侵略、捍卫国家统一的象征。",
  bg:"明亡清兴之际，东南沿海抗清力量此起彼伏。郑成功占据厦门一带，志在反清复明。台湾彼时为荷兰东印度公司占领，台湾人民饱受盘剥，郑成功亲率大军跨海东征，驱逐荷夷，收复宝岛。",
  timeline:[
    {period:"1624年",title:"出生",desc:"福建南安人。父郑芝龙为东南海商，母为日本人田川氏。出生于日本长崎，七岁回国。"},
    {period:"1646年",title:"起兵抗清",desc:"父郑芝龙降清，郑成功誓不降清，举义起兵，号'明招讨大将军'，以金门、厦门为基地抗清。"},
    {period:"1661年",title:"东征台湾",desc:"亲率战舰三百余艘、将士二万五千人，自金门料罗湾启航，横渡台湾海峡。"},
    {period:"1662年",title:"收复台湾",desc:"围困荷兰殖民者据点热兰遮城达数月，荷兰总督揆一被迫投降，台湾重回中国版图。"},
    {period:"1662年",title:"病逝",desc:"收复台湾后不足半年，积劳成疾，病逝于台湾，年仅39岁。"}
  ],
  works:[
    {name:"《延平王诏书》",period:"起兵抗清",context:"郑成功以'延平王'号令东南，发布文告号召抗清，阐发恢复华夏之志。",quote:"缟素临江，扬声厉鬼；枭雄回首，何事不成！"},
    {name:"抗清复台",period:"1661-1662年",context:"跨海东征前发布谕告，明收复台湾之志与治国安民之策，是其政治理想与民族气节的集中体现。",quote:"台湾者，中国之土地也，久为贵国所踞，今余既来索，则地当归我。"}

  {id:"qing",dynasty:"清",name:"林则徐",label:"林则徐",

  bg:"清代中后期，英国殖民者大量向中国走私鸦片，白银外流、国势日颓。林则徐受命为钦差大臣赴粤禁烟，虎门销烟，并组织翻译西书，探求自强之道。这标志着中国近代化历程的开端。",

    {period:"1839年",title:"虎门销烟",desc:"毒查禁鸦片，在虎门当众销毁鸦片约二百三十余万斤。震动中外，彰显民族正气。"},

    {period:"1850年",title:"病逝",desc:"太平天国兴起，命为钦差大臣赴广西，途中病逝于潮州。谥'文忠'。"}

  works:[

    {name:"《林文忠公政书》",period:"从政期间",context:"汇集其奏章政论，论禁烟、筹边、吏治，反映其经世致用、务实的政治思想。",quote:"以天下之须务，为一人之己责。"}

  bg:"太平天国运动席卷半壁江山，清廷八旗绿营不堪一击。曾国藩以在忧难中砥砺出的战略思想，组建地方武装湘军，历经艰险平定太平天国，重振了岌岌可危的清王朝，开启同光中兴。",

  works:[
    {name:"《曾国藩家书》",period:"一生",context:"所作家书约1500封，论修身、治学、齐家、处事、交友，是儒家修身处世的集大成之作。",quote:"盖士人读书，第一要有志，第二要有识，第三要有恒。"},
    {name:"《冰鉴》",period:"中年",context:"识人观人之书，总结观眉宇、辨气概以察人的相人之术，传为官场用人处世之要。",quote:"凡看人，先看其气概，而后才看其才略。"}

    {period:"1918年",title:"《狂人日记》",desc:"在《新青年》发表《狂人日记》，以'吃人'二字猛烈批判封建礼教。中国第一篇现代白话小说，是新文化运动的宣言书。"},

    {period:"1936年",title:"病逝上海",desc:"因肺病在上海逝世，享年55岁。葬于上海万国公墓（后迁虹桥万国公墓）。上万人送葬，'民族魂'白旗覆盖棺椁。"}

  works:[
    {name:"《狂人日记》",period:"1918年",context:"借精神病人'狂人'之口，揭示礼教'吃人'的本质。'我未吃过人，我却要从新来过。'中国第一篇白话小说。",quote:"我翻开历史一查……满本都写着两个字是'吃人'！"},
    {name:"《阿Q正传》",period:"1921年",context:"塑造阿Q这一'精神胜利法'的典型形象，深刻剖析国民劣根性，是鲁迅也是中国白话小说最重要的作品。",quote:"'我总算被儿子打了，现在的世界真不像样……'于是也心满意足的得胜的走了。"},

    {name:"《自嘲》",period:"1932年",context:"面对迫害与攻击，鲁迅从容调侃。'横眉冷对千夫指，俯首甘为孺子牛'——是其人格的最佳写照。",quote:"横眉冷对千夫指，俯首甘为孺子牛。"}

    {period:"青少年",title:"贫寒求学",desc:"家境贫寒，靠母亲替人缝洗为生。1918年北京师范学校毕业，任小学校长。"},
    {period:"1924年",title:"留学英国",desc:"赴英国伦敦大学东方学院任教，业余完成《老张的哲学》《赵子曰》《二马》等长篇小说，奠定文学地位。"},
    {period:"1930年代",title:"创作《骆驼祥子》",desc:"归国后在济南、青岛任教。1936年出版《骆驼祥子》，描写北平车夫祥子的悲剧人生，是其代表作。"},
    {period:"抗战时期",title:"主持文艺界",desc:"抗战时任中华全国文艺界抗敌协会负责人，创作大量通俗文艺与剧本。著有《四世同堂》。"},
    {period:"1950年代",title:"《茶馆》上演",desc:"新中国成立后任北京市文联主席。1957年创作话剧《茶馆》，1958年首演，成为中国话剧里程碑。"},
    {period:"1966年",title:"逝世",desc:"在'文化大革命'中遭受残酷迫害，1966年8月24日投太平湖自尽，终年67岁。1978年恢复名誉。"}

  works:[

    {name:"《骆驼祥子》",period:"1936年",context:"写北平破产农民祥子三起三落买车、终被黑暗社会吞噬的悲剧。是老舍现实主义创作的杰作。",quote:"他仿佛是个会走动的葬礼，每逢科里一办丧事，他总像个打杂的。"},
    {name:"《济南的冬天》",period:"济南任教时",context:"散文名篇，描绘济南冬天温晴的山水。文字清丽，是老舍散文中温暖的一篇。",quote:"济南的冬天是响晴的。"}
  ]},

// ===== 渲染 =====
var app=document.getElementById("app");
var sections={};
data.forEach(function(p){
  if(!sections[p.id]) sections[p.id]={title:p.dynasty,people:[]};
});
var order=["shang","chunqiu","qinhan","sanguo","liangjin","suitang","song","yuan","ming","qing","jindai"];
var html="";
order.forEach(function(id){
  var sec=sections[id]; if(!sec) return;
  html+='<section class="section" id="'+id+'"><div class="section-title"><h2>'+sec.title+'</h2></div><div class="grid">';
  data.filter(function(p){return p.id===id;}).forEach(function(p){
    html+='<div class="card" onclick="openModal(\''+p.name+'\')"><div class="card-hd"><span class="name">'+p.name+'</span><span class="tag">'+p.label+'</span></div><div class="card-bd"><p class="bio">'+p.intro+'</p><p class="ft"></p></div></div>';
  });
  html+='</div></section>';
});
app.innerHTML=html;

// ===== 弹窗 =====
function openModal(name){
  var p=null;
  data.forEach(function(d){if(d.name===name)p=d;});
  if(!p)return;
  document.getElementById("mname").textContent=p.name;
  document.getElementById("mdyn").textContent=p.dynasty+" · "+p.label;
  var b=document.getElementById("mbody");
  var html='<div class="bg-box"><strong>时代背景｜</strong>'+p.bg+'</div>';
  html+='<p class="intro">'+p.intro+'</p>';
  html+='<div class="timeline">';
  p.timeline.forEach(function(t){
    html+='<div class="tl-item"><div class="period">'+t.period+'</div><div class="title">'+t.title+'</div><div class="desc">'+t.desc+'</div></div>';
  });
  html+='</div>';
  html+='<div class="works-block"><h4>不同时期的作品与心境</h4>';
  p.works.forEach(function(w){
    html+='<div class="work-item"><div class="wname">'+w.name+' <span class="wperiod">（'+w.period+'）</span></div><div class="wcontext">'+w.context+'</div><div class="wquote">"'+w.quote+'"</div></div>';
  });
  html+='</div>';
  b.innerHTML=html;
  document.getElementById("modal").classList.add("open");
}
function closeModal(){
  document.getElementById("modal").classList.remove("open");
}
document.getElementById("modal").addEventListener("click",function(e){
  if(e.target===this)closeModal();
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closeModal();
});
</script>
